<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>序論暗記・全36答案</title>
<style>
  :root{
    --ink:#1a1c23;--paper:#f5f3ec;--card:#fff;--line:#dcd7c8;
    --step1:#2b6ca3;--step2:#b9532e;--step3:#4a7c46;--step4:#6b4a9c;
    --dim:#8a8578;--shadow:0 2px 10px rgba(30,28,20,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    line-height:1.85;font-feature-settings:"palt";-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:580px;margin:0 auto;padding:14px 14px 92px;}
  header{padding:4px 2px 8px;}
  .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--dim);font-weight:600;}
  h1{font-size:21px;margin:2px 0 0;font-weight:800;letter-spacing:.02em;}
  .sub{font-size:12px;color:var(--dim);margin-top:3px;}
  .legend{display:flex;gap:5px;margin:12px 0 2px;flex-wrap:wrap;}
  .lg{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);
      background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 8px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .d1{background:var(--step1);}.d2{background:var(--step2);}.d3{background:var(--step3);}.d4{background:var(--step4);}

  /* filter bar */
  .filters{display:flex;gap:6px;margin:12px 0 4px;align-items:center;}
  .search{flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:22px;
    font-size:13px;background:var(--card);color:var(--ink);outline:none;}
  .search:focus{border-color:var(--ink);}
  .duebtn{padding:9px 12px;border-radius:22px;border:1.5px solid var(--line);
    background:var(--card);font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .duebtn.on{background:var(--step2);color:#fff;border-color:var(--step2);}

  .picker{display:flex;gap:7px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none;}
  .picker::-webkit-scrollbar{display:none;}
  .chip{flex:none;padding:7px 13px;border-radius:22px;border:1.5px solid var(--line);
    background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:.15s;white-space:nowrap;position:relative;}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip .yb{font-size:10px;color:var(--dim);margin-right:4px;}
  .chip.on .yb{color:#cfc8b8;}
  .chip.mastered::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;
    background:var(--step3);border-radius:50%;border:2px solid var(--paper);}

  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px;}
  .mode{padding:9px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    font-size:12px;font-weight:700;text-align:center;cursor:pointer;color:var(--ink);transition:.15s;}
  .mode.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .mode small{display:block;font-size:9.5px;font-weight:500;opacity:.7;margin-top:1px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:20px 18px;margin-top:12px;}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px;}
  .theme-title{font-size:15px;font-weight:800;line-height:1.4;}
  .yr{font-size:11px;color:var(--dim);letter-spacing:.05em;flex:none;}

  .step{margin:0 0 15px;padding-left:12px;border-left:3px solid var(--line);}
  .step:last-of-type{margin-bottom:0;}
  .step-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;margin-bottom:5px;display:block;}
  .step1{border-left-color:var(--step1);}.step1 .step-label{color:var(--step1);}
  .step2{border-left-color:var(--step2);}.step2 .step-label{color:var(--step2);}
  .step3{border-left-color:var(--step3);}.step3 .step-label{color:var(--step3);}
  .step4{border-left-color:var(--step4);}.step4 .step-label{color:var(--step4);}
  .step-body{font-size:14.5px;}
  .step4 .step-body{font-weight:600;}
  .empty-note{font-size:12px;color:var(--dim);font-style:italic;}

  .blank{border-bottom:2px solid var(--line);color:transparent;background:#efece2;
    border-radius:3px;cursor:pointer;user-select:none;transition:.12s;padding:0 1px;}
  .blank.show{color:var(--ink);background:transparent;border-bottom-color:transparent;}
  .key{color:var(--step4);font-weight:700;background:#f0ebf7;border-radius:3px;padding:0 2px;}

  .revealbar{display:flex;gap:8px;margin-top:14px;}
  .btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);}
  .btn-fill{background:var(--ink);color:#fff;}
  .grade{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
  .grade.show{display:grid;}
  .g{padding:13px 6px;border-radius:12px;border:none;font-size:13px;font-weight:800;cursor:pointer;color:#fff;text-align:center;}
  .g small{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:2px;}
  .g-again{background:#b9532e;}.g-hard{background:#c99a2e;}.g-good{background:#4a7c46;}

  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(245,243,236,.94);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
    max-width:580px;margin:0 auto;}
  .nav .prog{flex:1;font-size:12px;color:var(--dim);text-align:center;}
  .nav .prog b{color:var(--ink);font-size:14px;}
  .navbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--card);font-size:18px;cursor:pointer;color:var(--ink);}
  .density{display:flex;align-items:center;gap:10px;margin-top:12px;padding:0 2px;}
  .density .dl{font-size:11.5px;color:var(--dim);font-weight:600;flex:none;}
  .dbtns{display:flex;gap:6px;flex:1;}
  .db{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s;}
  .db.on{background:var(--step2);color:#fff;border-color:var(--step2);}
  .statbar{display:flex;gap:8px;margin:12px 0 2px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 10px;box-shadow:var(--shadow);}
  .stat .sh{font-size:10.5px;color:var(--dim);font-weight:700;margin-bottom:4px;}
  .stat .snum{font-size:15px;font-weight:800;}
  .stat .snum small{font-size:11px;color:var(--dim);font-weight:600;}
  .sbar{height:5px;background:#e9e5d9;border-radius:3px;margin-top:6px;overflow:hidden;}
  .sbar i{display:block;height:100%;background:var(--step3);border-radius:3px;transition:width .3s;}

  .srcfilter{display:flex;gap:6px;margin-top:8px;}
  .sf{flex:1;padding:7px 4px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s;}
  .sf.on{background:var(--step1);color:#fff;border-color:var(--step1);}

  .tabs{display:flex;gap:6px;margin:10px 0 2px;background:#e9e5d9;padding:4px;border-radius:14px;}
  .tab{flex:1;padding:10px 4px;border-radius:10px;border:none;background:transparent;
    font-size:13.5px;font-weight:800;color:var(--dim);cursor:pointer;transition:.15s;}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

  .tmpl-intro{font-size:12.5px;color:var(--dim);line-height:1.7;margin:14px 2px 6px;}
  .tmpl-intro b{color:var(--ink);}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:18px 16px;margin-top:12px;}
  .tcard-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .tbadge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    font-weight:900;font-size:15px;color:#fff;flex:none;}
  .tname{font-size:15.5px;font-weight:800;line-height:1.3;}
  .ttag{font-size:11.5px;color:var(--dim);margin:2px 0 12px 39px;}
  .tskel{border-left:3px solid var(--line);padding-left:12px;margin:0 0 10px;}
  .tskel:last-of-type{margin-bottom:0;}
  .tslabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;display:block;margin-bottom:4px;}
  .tsbody{font-size:14px;line-height:1.8;}
  .tsbody .ph{background:#f0ebf7;color:var(--step4);font-weight:700;border-radius:3px;padding:0 3px;}
  .tswap{background:#f5f2e8;border-radius:10px;padding:10px 12px;margin-top:12px;
    font-size:12px;line-height:1.7;color:#5c5647;}
  .tswap b{color:var(--step2);}
  .tvariant{background:#eef2f6;border-radius:10px;padding:10px 12px;margin-top:8px;
    font-size:12px;line-height:1.7;color:#42505c;}
  .tvariant b{color:var(--step1);}
  .tmembers{margin-top:12px;}
  .tm-title{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:6px;letter-spacing:.05em;}
  .tm-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .tm-chip{font-size:11.5px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);cursor:pointer;transition:.12s;}
  .tm-chip:active{background:var(--ink);color:#fff;}
  .tm-chip .y{color:var(--dim);margin-right:4px;font-size:10px;}

  .hint{font-size:11.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.6;}
  .done{text-align:center;padding:28px 10px;}
  .done h2{font-size:19px;margin:0 0 6px;}
  .done p{color:var(--dim);font-size:13.5px;margin:0 0 16px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">特別区・課題式論文 / 過去問36答案</div>
    <h1>序論 暗記トレーナー</h1>
    <div class="sub">社会背景 → 課題／緊張 → 必要性宣言 → 予告文</div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="essays">答案 46本</button>
    <button class="tab" data-t="templates">テンプレ 7型</button>
  </div>

  <div id="panel-essays">
  <div class="statbar" id="statbar"></div>
  <div class="legend">
    <span class="lg"><span class="dot d1"></span>①社会背景</span>
    <span class="lg"><span class="dot d2"></span>②課題／緊張</span>
    <span class="lg"><span class="dot d3"></span>③必要性</span>
    <span class="lg"><span class="dot d4"></span>④予告文</span>
  </div>

  <div class="filters">
    <input class="search" id="search" placeholder="テーマ・年度で検索（例: 協働, 2022）">
    <button class="duebtn" id="dueBtn">復習</button>
  </div>
  <div class="srcfilter" id="srcfilter">
    <button class="sf on" data-s="all">すべて 46</button>
    <button class="sf" data-s="kakomon">過去問 36</button>
    <button class="sf" data-s="renshu">答練・模試 10</button>
  </div>

  <div class="picker" id="picker"></div>

  <div class="modes" id="modes">
    <div class="mode on" data-m="read">通読<small>色分け全文</small></div>
    <div class="mode" data-m="key">要点<small>予告文型</small></div>
    <div class="mode" data-m="half">虫食い<small>語句を隠す</small></div>
    <div class="mode" data-m="full">全隠し<small>SRS暗唱</small></div>
  </div>

  <div class="density" id="density" style="display:none;">
    <span class="dl">虫食い量</span>
    <div class="dbtns">
      <button class="db" data-d="0.3">少なめ</button>
      <button class="db on" data-d="0.55">標準</button>
      <button class="db" data-d="0.8">多め</button>
      <button class="db" data-d="1">全部</button>
    </div>
  </div>

  <div id="stage"></div>
  <div class="hint" id="hint"></div>
  </div><!-- /panel-essays -->

  <div id="panel-templates" style="display:none;">
    <div class="tmpl-intro">似た書き出しの答案をまとめた<b>共通テンプレート</b>です。骨格の〔　〕を差し替えるだけで別テーマに転用できます。</div>
    <div id="tmpl-list"></div>
  </div>
</div>

<div class="nav" id="nav">
  <button class="navbtn" id="prev">‹</button>
  <div class="prog"><b id="pnum">1</b> / <span id="ptot">36</span></div>
  <button class="navbtn" id="next">›</button>
</div>

<script>
const RAW = [{"year": "2007", "theme": "地域の個性を生かした魅力あるまちづくりについて", "short": "地域の個性を生かした魅力ある", "s1": "現在、我が国では人口減少社会が到来している。全国的にも限界集落が問題となるなど、多くの自治体において持続的な地域運営が課題となっている。", "s2": "このため、地域の活力を維持・向上させていくためには、多くの人から「住み続けたい」「訪れてみたい」「ここで働きたい」と実感される地域を形成していかなければならない。そのために大切なことが、地域の個性を生かしたまちづくりである。", "s3": "地域が有する多彩な特色や特性こそ、その地域にしかない個性であり魅力である。特別区においても、更なる活力や活気の創出に向けて、地域の個性を生かしたまちづくりを推進していかなければならない。", "s4": "そのために必要な取組を以下に論じていきたい。", "cls": "A", "kind": "kakomon"}, {"year": "2007", "theme": "顧客主義に基づく行政サービスについて", "short": "顧客主義に基づく行政サービス", "s1": "特別区は、約1000万人の区民に対して、多種多様な行政サービスを提供している。サービス対象者の多さや予算規模などに鑑みると、住民生活を身近に支える区役所の業務は、地域における最大のサービス業と言えるだろう。", "s2": "このような業務の特性から、近年では各自治体においても、住民一人ひとりを「顧客」と捉え、地域住民の視点や立場に立って行政サービスの向上に努めていく「顧客主義」が行政運営の指針として掲げられている。行政サービスに対する満足度の最大化を図る上では、区民ニーズに寄り添った施策展開が欠かせない。", "s3": "今後も特別区が、納税者である区民の負託に応え、行政サービスの向上を推進していくためには、顧客主義を起点とした行政運営に努めていくことが肝要である。", "s4": "以上を踏まえ、顧客主義に基づく行政サービスの提供に向けて必要な取組を論じていく。", "cls": "Z", "kind": "kakomon"}, {"year": "2008", "theme": "効率的な行政運営について", "short": "効率的な行政運営", "s1": "現在、特別区では、今後の行政運営に当たり、業務の効率化が大きな課題となっている。その理由として、大きく２つの背景がある。１つ目は、財政需要の増大である。", "s2": "少子高齢化や大規模災害への対策をはじめ、公共施設の老朽化への対応など、特別区には多くの課題が山積しており、今後も財政需要が増大していくことが見込まれている。２つ目は、人口減少社会の到来である。少子化の進展に伴い、将来的には特別区の人口も減少が予測されている。", "s3": "人口が減少する社会は納税者が減少する社会であり、生産年齢人口の減少が税収の減少につながっていく懸念がある。このことから、将来にわたって質の高い行政サービスを維持していくためにも、行政運営の効率化が強く求められている。", "s4": "以上を踏まえ、効率的な行政運営の推進に必要な取組を以下に論じていきたい。", "cls": "E", "kind": "kakomon"}, {"year": "2008", "theme": "特別区における環境負荷の軽減について", "short": "特別区における環境負荷の軽減", "s1": "現代の大量生産・大量消費・大量廃棄というシステムは、地球環境に大きな負荷を与えている。ごみ問題や大気汚染、水質汚濁といった身近な環境問題のほか、近年では地球温暖化に伴う異常気象の発生、プラスチックごみによる海洋汚染など地球規模での環境問題も深刻化している。", "s2": "このような危機を背景に、国連サミットでは「持続可能な開発目標（SDGｓ）」が採択されるなど、持続可能な社会の実現に向けた動きが世界的にも活発化している。環境問題は、現代を生きる我々だけではなく、将来世代にもつながる課題である。", "s3": "良好な環境を保全し、これを将来に継承していくためにも、特別区は環境負荷を軽減した持続的な都市づくりを進めていかなければならない。", "s4": "そのために必要な取組を以下に論じていく。", "cls": "D", "kind": "kakomon"}, {"year": "2009", "theme": "技術の継承について", "short": "技術の継承", "s1": "特別区内には、個人や企業などが有する様々な技術が存在している。例えば、区内には、江戸切子や東京手描友禅をはじめ、時代を超えて現代に受け継がれてきた様々な伝統技術がある。", "s2": "また、町工場や中小企業においても高度な技術が長年にわたって培われており、世界有数の技術が数多く集積している。これらの技術は、地域の貴重な資源であり、地域文化や地場産業の振興の一端を担うものである。そして、地域の特色や活力を生み出す原動力となっている。", "s3": "一方、地域が保有する「技術」というものは、個人や企業が有するものだけではない。行政が蓄積してきた運営の手法やノウハウも、広義としての「技術」に含まれるだろう。", "s4": "以下においては、個人や企業などが有する「民間が持つ技術」と、特別区が保有する「行政が持つ技術」の２つに分けて、継承のあり方を論じていきたい。", "cls": "Z", "kind": "kakomon"}, {"year": "2009", "theme": "行政に問われる説明責任について", "short": "行政に問われる説明責任", "s1": "説明責任とは、一定の責任を負った者は自らの責任に関して十分な説明を果たさなくてはならないという考え方のことである。行政組織には説明責任が強く求められており、特別区においても、区民への説明責任を果たす手段として情報公開制度や行政評価制度などが導入されている。では、なぜ行政には説明責任が求められるのだろうか。その背景として大きく２点を挙げることができる。", "s2": "１つ目は、区役所が区民からの負託を受けて活動していることである。区役所では、区民一人ひとりから集められた税金によって行政サービスを提供している。このため、納税者である区民の理解や納得を得られるように丁寧で正確な説明に努めていくことが行政の責務と言える。２つ目は、区民参加のまちづくりを促進するためである。地域課題を解決し魅力的な地域を形成していくためには、行政と区民による協働のまちづくりが不可欠である。", "s3": "他方、協働のまちづくりに当たっては、行政と区民の相互の信頼関係が大切である。信頼関係を構築する上では、十分な情報の共有が欠かせない。このため、区民に行政を身近に感じてもらい、行政に対する信頼を醸成していく上でも、行政による説明責任が必要となってくる。", "s4": "以上の背景を踏まえ、行政に問われる説明責任と、その責任を果たすために必要な取組を論じていきたい。", "cls": "B", "kind": "kakomon"}, {"year": "2010", "theme": "公務員としての倫理について", "short": "公務員としての倫理", "s1": "倫理とは、社会生活において人々が守るべき規範や行動する際の規準となるものである。そして、世の中にある様々な職業においては、その職業が果たすべき役割や社会からの期待に応えるための行動のあり方といった「職業倫理」というものが存在する。", "s2": "公務員も例外ではない。むしろ、公務員は他の職業以上に、高い倫理観が求められている。近年では全国の自治体においても「職員倫理条例」が制定され、特別区においても一部の自治体がは、毎年、職員倫理条例の運営状況を区民に公表している。", "s3": "これらの動向からも、公務員には高い倫理観が求められていることが理解できる。では、なぜ公務員には高い倫理観が求められるのだろうか。", "s4": "以下においては、その理由を考察するとともに、公務員に求められる具体的な倫理観や、倫理観の保持に向けた対応策を論じていきたい。", "cls": "B", "kind": "kakomon"}, {"year": "2010", "theme": "行政における危機管理について", "short": "行政における危機管理", "s1": "行政は、日々の活動において様々な危機への対応を求められている。行政が直面する危機は、大きく２つに分けることができるだろう。", "s2": "１つ目は、区民の生命や財産に重大な被害を与える危機である。具体的には、地震や台風などの自然災害、大規模な事故や火災、犯罪やテロ、感染症の蔓延などである。２つ目は、行政運営への信頼や期待を大きく損なう危機である。", "s3": "例えば、職員による不正や不祥事、大規模なシステム障害、個人情報・機密情報の漏洩、公文書の紛失などが挙げられる。区民からの信頼と期待に応え、区民の生命や財産、平穏な生活を守り抜いていくためにも、特別区は危機管理を徹底し、あらゆる危機の未然防止や被害の最小化に努めていかなければならない。", "s4": "以上を踏まえ、区政運営における危機管理のあり方について、上記の２つの区分に沿って論じていきたい。", "cls": "E", "kind": "kakomon"}, {"year": "2011", "theme": "循環型社会の形成に向けて", "short": "循環型社会の形成", "s1": "現代の大量生産・大量消費・大量廃棄という社会システムは、人々に対し物質的に豊かで便利な生活を提供してきた。一方で、このようなシステムは、天然資源の枯渇やごみの埋立地の確保問題、産業廃棄物の不法投棄、有害廃棄物による土壌汚染などを引き起こしている。", "s2": "その他にも、ごみの焼却に伴い排出される二酸化炭素が地球温暖化を加速させ、海に流出したプラスチックごみが海洋汚染や生態系への影響をもたらすなど、地球環境に大きな負荷を与えている。このような課題を克服し、良好な生活環境を将来世代に継承していくためにも、特別区は環境と共生する持続的な都市づくりを進めていかなければならない。", "s3": "そのために必要となるのが、循環型社会の形成である。循環型社会とは、天然資源の消費を抑制し、環境への負荷を可能な限り低減した社会のことである。", "s4": "以下、循環型社会の形成に向けて特別区が果たすべき役割について論じていきたい。", "cls": "D", "kind": "kakomon"}, {"year": "2011", "theme": "行政と民間の協働について", "short": "行政と民間の協働", "s1": "協働とは、行政が地域課題の解決に向けて、自治会・ＮＰО・大学・事業者等の異なる強みを持つ主体（以下「民間団体」という。）との連携・協力を進めていくことである。", "s2": "近年、少子高齢化の進行や国際化の進展、住民の価値観やライフスタイルの多様化など社会環境は大きく変化しており、行政が抱える地域課題や住民ニーズは複雑・多様化している。一方で、限られた人員と厳しい財政状況の中において、行政だけで全ての課題に対応していくことには限界もある。", "s3": "そこで、民間団体との協働を進めることで、さらなるサービスの拡充や新たな施策の展開も可能となってくる。今後も地域課題や住民ニーズに迅速かつ的確に対応していくためには、地域で活動する多様な主体との協働を進めていかなければならない。", "s4": "このような状況を踏まえ、行政と民間との協働を推進していくために必要な取組を述べていきたい。", "cls": "B", "kind": "kakomon"}, {"year": "2012", "theme": "住民と一体となった活力ある地域づくりについて", "short": "住民と一体となった活力ある地", "s1": "近年、地域を取り巻く社会環境は大きく変化している。区内では、自治会・町内会への加入率の低下や、地域防災を担う消防団の慢性的な団員不足が生じるなど、地域への帰属意識の希薄化が進んでいる。", "s2": "また、賃貸住宅で暮らす住民の増加や単身世帯の増大に伴い、地域における住民相互のつながりも弱まる傾向にある。この他にも、単身者の社会的孤立、児童虐待、老老介護、防犯・防災対策など、行政だけでは対応が困難な様々な課題が地域において山積している。", "s3": "住民一人ひとりが安心や豊かさを感じられる活力ある地域を形成していくためには、行政と住民が一体となった地域づくりを進めていくことが不可欠である。", "s4": "そのために必要な取組を以下に論じていきたい。", "cls": "G", "kind": "kakomon"}, {"year": "2012", "theme": "民間的な発想を生かした行政運営について", "short": "民間的な発想を生かした行政運", "s1": "近年、高齢化の急速な進行や国際化の進展、住民の価値観やライフスタイルの多様化など社会環境は大きく変化しており、行政が抱える地域課題や住民ニーズは複雑・多様化している。", "s2": "一方で、特別区の財政状況は依然として厳しい状況が続いており、限られた人員と予算の中で効果的な行政サービスを提供していくことが求められている。", "s3": "そのため今後の区政運営においても、従来の手法や発想だけにとらわれず、民間が有する発想を大胆かつ柔軟に取り入れていくことが大切となるだろう。", "s4": "以上を踏まえ、民間的な発想をどのように行政運営に生かしていくべきか論じていきたい。", "cls": "C", "kind": "kakomon"}, {"year": "2013", "theme": "住民サービスとそれに係る経費について", "short": "住民サービスとそれに係る経費", "s1": "現在、我が国は人口減少社会に突入している。", "s2": "特別区においても2040年以降には人口が減少に転じることが予測されており、とりわけ生産年齢人口の減少は、区税収入の減少につながっていくだろう。その一方で、高齢化の進展に伴う福祉ニーズの増大、各種インフラの老朽化対策、大規模自然災害への対応など、特別区における財政状況は今後も厳しさを増していく。", "s3": "このため、将来にわたって質の高い住民サービスを提供していくためには、無駄がなく効率的な経費の執行を実現していかなければならない。", "s4": "そこで私は、今後の特別区において以下の取組が必要だと考える。", "cls": "A", "kind": "kakomon"}, {"year": "2013", "theme": "区民の声を活かした政策形成について", "short": "区民の声を活かした政策形成", "s1": "特別区では、豊かな区民生活と魅力ある地域づくりに向けて、日々新たな政策形成に取り組んでいる。その一方で、近年では区民の価値観やライフスタイルの多様化に伴い、行政に対する期待や要望も多岐にわたっている。", "s2": "このような状況において、画一化された手段や従来の方法だけでは、区民満足度の高い区政運営を進めていくことは困難である。このため、区職員は、幅広い区民ニーズを的確に捉え、区民の声を活かした政策形成に取り組んでいかなくてはならない。", "s3": "これを実現するため、大きく２つの取組が必要であると考える。", "s4": "以下において、それらを具体的に論じていきたい。", "cls": "C", "kind": "kakomon"}, {"year": "2014", "theme": "区民から喜ばれる行政サービスの提供について", "short": "区民から喜ばれる行政サービス", "s1": "特別区は、区民一人ひとりの豊かで快適な生活を支えるため、日々様々な行政サービスを提供している。", "s2": "特別区にとっては、区民ニーズを的確に捉えながら区民の喜びや満足度の向上につながるサービスを提供していくことが、重要な使命の一つと言えるだろう。そして、区民から喜ばれる行政サービスを継続的に提供していくことが、「住んで良かった」「これからも住み続けたい」と感じられる地域を形成していくことにつながっていく。", "s3": "しかしながら、区民一人ひとりの価値観やニーズも多様化しており、区民から喜ばれる行政サービスを提供していくことは簡単なことではない。", "s4": "このような状況を踏まえ、区民から喜ばれる行政サービスを提供していくために特別区はどのように取り組んでいくべきか、以下に論じていきたい。", "cls": "F", "kind": "kakomon"}, {"year": "2014", "theme": "地域社会に必要とされる公園のあり方について", "short": "地域社会に必要とされる公園", "s1": "公園は、訪れる人々に安らぎや潤いをもたらす空間として、また、人々の交流やレクリエーションの場として大きな役割を果たしている。", "s2": "特に、人口密度が高く、住宅や高層ビルが密集する特別区において、公園は住民生活にとって貴重な空間である。また、新型コロナウイルスの感染拡大を契機とした暮らし方・働き方の変化を背景に、テレワーク等によって自宅周辺で過ごす時間も増加し、休息や憩いの場として公園の重要性が一層高まっている。", "s3": "公園は、地域社会の共有財産として将来にわたって良好に維持されるべき大切な資源と言えるだろう。", "s4": "このような現状を踏まえ、地域社会に必要とされる公園のあり方を以下に論じていきたい。", "cls": "F", "kind": "kakomon"}, {"year": "2015", "theme": "地域イベント開催にあたっての住民要望の調整について", "short": "地域イベント開催にあたっての", "s1": "特別区では、文化や教育、環境、防災、スポーツなどに関連した様々なイベントを地域で開催している。このような地域イベントは、地域の活気や賑わいの創出、交流人口の拡大、住民同士のつながりの強化などに効果的であり、豊かな住民生活の実現に多面的な役割を果たしている。", "s2": "しかしながら、住民の価値観の多様化やライフスタイルの変化に伴い、地域イベントに対する意見や要望も複雑化している。例えば、地域のお祭りなどにおいては、一部の住民から騒音としての苦情が届けられることも今や珍しくないと聞く。", "s3": "特別区においては、多様な住民要望を可能な限り調整し、多くの地域住民がイベントに親しみ、地域が一体となれるイベントを開催していかなければならない。", "s4": "以上を踏まえ、地域イベントの開催にあたり、住民要望の調整のあり方について述べていきたい。", "cls": "Z", "kind": "kakomon"}, {"year": "2015", "theme": "行政におけるコンプライアンスについて", "short": "行政におけるコンプライアンス", "s1": "コンプライアンスとは、法令を遵守するとともに、社会通念上の常識や倫理観に照らして正しい行動を取ることである。昨今においても、公務員による不正や不祥事が頻繁に発生しており、行政に対する社会の目も厳しさを増している。", "s2": "公務員は、納税者である国民一人ひとりからの負託を受けた存在であり、高い規範意識が求められている。職員が違法行為や重大なミスを引き起こすと、その不祥事を起こした職員だけでなく、行政組織全体の信用失墜につながっていく。", "s3": "そして、一度失った信頼を回復するためには、多大な労力や時間を要することとなる。このため、特別区では、区民との将来にわたる信頼関係を維持していくためにも、組織全体としてコンプライアンスの推進に取り組んでいかなければならない。", "s4": "以上を踏まえ、コンプライアンスの推進に向けて必要な取組を述べていきたい。", "cls": "B", "kind": "kakomon"}, {"year": "2016", "theme": "グローバル社会の進展に伴う行政運営のあり方について", "short": "グローバル社会の進展に伴う行", "s1": "現在、特別区では約180もの国籍の外国人が暮らしており、外国人人口が60万人を超えている。", "s2": "また、区内では外国人住民だけではなく外国人旅行者数も増加傾向にあり、特別区では急速にグローバル化が進んでいる。国際都市東京の中心である特別区では、今後もさらに国際的な交流や活動が活発となり、異なる国籍・言語・文化・宗教などを有した外国人がより一層増えていくことだろう。", "s3": "このため、特別区ではグローバル社会に的確に対応した行政運営を展開し、外国人と日本人が共生できる地域社会を築いていかなければならない。", "s4": "そのために必要な取組を以下に論じていく。", "cls": "Z", "kind": "kakomon"}, {"year": "2016", "theme": "区民ニーズの把握と施策への反映について", "short": "区民ニーズの把握と施策への反", "s1": "特別区では、豊かな区民生活の実現と新たな地域課題の解決に向けて、日々様々な施策を展開している。その一方で、近年では区民の価値観やライフスタイルの多様化に伴い、行政に対する期待や要望も多岐にわたっている。", "s2": "このような状況において、画一化された手段や従来の方法だけでは、区民満足度の高い区政運営を進めていくことは困難である。このため、区職員は、幅広い区民ニーズを的確に捉え、可能な限り施策に反映していかなければならない。", "s3": "これを実現するため、大きく２つの取組が必要であると考える。", "s4": "以下において、それらを具体的に論じていきたい。", "cls": "C", "kind": "kakomon"}, {"year": "2017", "theme": "区政運営における区民との協働について", "short": "区政運営における区民との協働", "s1": "協働とは、行政が地域課題の解決に向けて、住民・自治会・ＮＰО・事業者等の異なる強みを持つ主体（以下「区民」という。）との連携・協力を進めていくことである。", "s2": "近年、少子高齢化の進行や国際化の進展、住民の価値観やライフスタイルの多様化など社会環境は大きく変化しており、行政が抱える地域課題や住民ニーズは複雑・多様化している。一方で、限られた人員と厳しい財政状況の中において、行政だけで全ての課題に対応していくことには限界もある。", "s3": "そこで、区民との協働を進めることで、さらなるサービスの拡充や新たな施策の展開も可能となってくる。今後も地域課題や住民ニーズに迅速かつ的確に対応していくためには、地域で活動する多様な主体との協働を進めていかなければならない。", "s4": "このような状況を踏まえ、行政と区民との協働を推進していくために必要な取組を述べていきたい。", "cls": "B", "kind": "kakomon"}, {"year": "2017", "theme": "最小の経費で最大の効果を生む区政運営について", "short": "最小の経費で最大の効果を生む", "s1": "現在、我が国は人口減少社会に突入している。", "s2": "特別区においても2040年以降には人口が減少に転じることが予測されており、とりわけ生産年齢人口の減少は、区税収入の減少につながっていく。その一方で、高齢化の進展に伴う福祉ニーズの増大、各種インフラの老朽化対策、大規模自然災害への対応など、特別区における財政状況は今後も厳しさを増していくことが想定される。", "s3": "このため、特別区においては、組織及び運営に関する合理化を進め、最小の経費で最大の効果を生み出す区政運営を実現していかなければならない。", "s4": "そのために必要な取組を以下に論じていく。", "cls": "A", "kind": "kakomon"}, {"year": "2018", "theme": "区民への情報発信のあり方について", "short": "区民への情報発信", "s1": "特別区の重要な責務として、区民に対し区政運営や区民生活に関する情報を迅速かつ正確に発信していくことが挙げられる。特別区が魅力ある地域づくりや地域の課題解決を進めていく上では、区民からの信頼と協力が欠かせない。", "s2": "それらを支える基盤となるのが、区民に対する区政情報の発信である。正確な情報を確実に届けていくことが、区民からの信頼確保へとつながっていく。また、区民の生命や生活を守る観点からも、区民への情報発信は不可欠である。", "s3": "災害対策や各種福祉サービス等に関する情報を確実に届けていくことが、区民一人ひとりの生命や生活を支えることにつながっていく。これらのことから、特別区は常に確実な情報発信に努めていくことが求められる。", "s4": "以上を踏まえ、区民への情報発信のあり方について論じていきたい。", "cls": "Z", "kind": "kakomon"}, {"year": "2018", "theme": "行政運営の効率化と信頼性の確保について", "short": "行政運営の効率化と信頼性の確", "s1": "現在、我が国は人口減少社会に突入している。特別区においても2040年以降には人口が減少に転じることが予測されており、とりわけ生産年齢人口の減少は、区税収入の減少につながっていく。", "s2": "その一方で、高齢化の進展に伴う福祉ニーズの増大、各種インフラの老朽化対策、大規模自然災害への対応など、特別区における財政状況は今後も厳しさを増していくことが想定される。このため、特別区においては、行政運営の効率化を不断に進めていかなければならない。", "s3": "しかしながら、その進め方によっては、区民に対して不安や不信をもたらしてしまうだろう。行政運営の効率化には、区民の理解や納得を十分に確保し進めていくことが求められる。", "s4": "このことを踏まえ、行政運営の効率化に必要な方策を取り上げながら、区民からの信頼確保に向けた取組を論じていきたい。", "cls": "A", "kind": "kakomon"}, {"year": "2019", "theme": "地域コミュニティの活性化について", "short": "地域コミュニティの活性化", "s1": "地域コミュニティとは、町会・自治会、商店会、ＰＴＡ、消防団など、一定の地域を基盤とした住民同士のつながりや活動のことである。地域コミュニティは地域社会を支える基盤であり、共助に基づく地域課題の解决や住民相互の支え合い、多世代間の交流の促進において大きな役割を果たしている。しかし、近年は自治会の加入率の低下や地域活動の担い手不足、消防団員の減少など、地域コミュニティが衰退の傾向にある。このような問題の背景として、２つの要因が考えられる。", "s2": "１つ目は、地域に対する愛着・帰属意識の低下である。特別区では住民の転出入が激しく人口の流動性が高いため、特定の地域への愛着・帰属意識が希薄となり、地域活動への参加意欲が高まりにくい状況となっている。２つ目は、地域住民の価値観の多様化である。プライバシー意識の高まりから、若年世代を中心に近隣との関わりを求めない傾向が強まっている。", "s3": "とりわけ区内で増加しているマンション等の集合住宅においては、住民同士の無関心・無干渉が進み、コミュニティの形成が困難となっている。こうした状況は、地域における防犯機能の低下、高齢者等の孤立や孤独死、児童虐待の発見の遅れ、災害発生時の被害拡大など深刻な問題へとつながっていく。", "s4": "以上を踏まえ、地域コミュニティの活性化に向けた方策を述べていきたい。", "cls": "G", "kind": "kakomon"}, {"year": "2019", "theme": "組織力の向上について", "short": "組織力の向上", "s1": "現在、特別区は多くの課題に直面している。大規模自然災害への対応をはじめ、少子高齢化対策や各種インフラの老朽化対策など、多様な地域課題の解決が求められている。", "s2": "その一方で、特別区では財政状況が厳しさを増している。特別区は、限られた人員や予算の中で地域住民の暮らしを支え、魅力ある地域づくりを行うことが求められている。", "s3": "このため、今後の区政運営においては、職員一人ひとりの能力を結集し、相互の連携によって迅速かつ的確に課題解決を進めていける組織づくりを進めていかなければならない。このような組織こそが「組織力」の高い組織であると考える。", "s4": "以上を踏まえ、特別区における組織力の向上に必要な取組を論じていきたい。", "cls": "Z", "kind": "kakomon"}, {"year": "2020", "theme": "住民意識の多様化と自治体職員の役割について", "short": "住民意識の多様化と自治体職員", "s1": "我が国の地域社会では、住民意識の多様化が進んでいる。この住民意識の多様化については、「住民ニーズの多様化」と「住民の価値観の多様化」の２つに分けて考えることができるだろう。まず、住民ニーズの多様化について取り上げたい。", "s2": "現代では人々の属性やライフスタイルは大きく異なっている。特に、特別区のような都心部では、住民の働き方や世帯構成、所得、国籍などは様々である。このため、住民一人ひとりが抱えている生活上の課題も多岐にわたっており、行政に対する住民ニーズも多様化が進んでいる。次に、住民の価値観の多様化についてである。", "s3": "例えば、人々のプライバシー意識の高まりから、近隣との関わりを求めない傾向が強まっている。また、若年世代を中心に地域活動よりもプライベートな活動を重視する傾向も強く、自治会の加入率の低下や消防団員の減少など、地域コミュニティの衰退が進んでいる。", "s4": "このような住民意識の多様化を踏まえ、自治体職員の果たすべき役割を以下に論じていきたい。", "cls": "C", "kind": "kakomon"}, {"year": "2020", "theme": "若者の区政参加と地域の活性化について", "short": "若者の区政参加と地域の活性化", "s1": "まちづくりの主人公は、地域で暮らす住民である。地域の活性化を図る上では、住民一人ひとりが主体的な意識を持ってまちづくりに参画していくことが欠かせない。", "s2": "一方で、近年は価値観の多様化により、地域活動や区政参加に対し関心を持たない住民も増えている。とりわけ若年世代にはそのような傾向が強い。", "s3": "地域において高齢化が進む中、地域活動や地域コミュニティの持続化を図り、将来にわたって地域の活力を保持するためには、若者が地域での活動や地域課題の解決に関心に持ち、区政に参加していくことが極めて重要であると考える。", "s4": "以上を踏まえ、若者の区政参加への意識を高め地域を活性化していくための方策を論じていきたい。", "cls": "G", "kind": "kakomon"}, {"year": "2021", "theme": "インターネットを活用した行政手続について", "short": "インターネットを活用した行政", "s1": "近年、デジタル技術の進展に伴い、インターネットを活用した行政手続の導入が進められている。現代では働き方やライフスタイルの多様化が進み、開庁時間内に行政機関の窓口を訪れるのが難しい人も多い。", "s2": "インターネットを活用した行政手続が可能となれば、仕事や育児、介護などを抱えた住民であっても気軽に行政手続を行える。また、新型コロナウイルスの感染拡大を経て人々の密集・密接の回避が求められる社会状況においては、窓口の混雑を緩和するためにもインターネットによる行政手続は効果的である。", "s3": "このような意義を踏まえ、特別区は、地域住民の誰もがインターネットを活用した行政手続を行えるように取り組んでいかなければならない。", "s4": "そのために必要な取組を以下に論じていく。", "cls": "Z", "kind": "kakomon"}, {"year": "2021", "theme": "持続可能な財政運営と区民サービスについて", "short": "持続可能な財政運営と区民サー", "s1": "特別区が将来にわたって区民生活を支えていくためには、財政運営や区民サービスにおける持続可能性を確保していくことが重要となってくる。特に、今後の行政運営に当たっては、これまで以上に持続可能性の確保が求められるだろう。", "s2": "現在特別区では、少子化対策や災害対策、老朽化した社会インフラへの対応など、膨大な財政需要が見込まれている。このため、未来を見据えた歳出抑制への取組が不可欠となっている。また、少子化の進行に伴い、将来的には特別区の人口も減少が予測されている。", "s3": "人口の減少は、納税義務者の減少、ひいては税収の減少につながっていくだろう。以上のような歳出増大や税収減少を踏まえると、財政運営や区民サービスにおける持続可能性の確保が肝要となってくる。", "s4": "このことを踏まえ、持続可能な財政運営と区民サービスの実現に向けて必要な取組を以下に論じていきたい。", "cls": "Z", "kind": "kakomon"}, {"year": "2022", "theme": "シティプロモーションについて", "short": "シティプロモーション", "s1": "現在、我が国では人口減少社会が到来しており、特別区においても2040年以降に人口が減少に転じることが予測されている。", "s2": "地域における人口の減少は、経済活動の縮小に伴う雇用や税収の減少、地域活動や地域コミュニティの衰退、地域の活気や賑わいの喪失につながっていく。そして、そのような状況が進行することは地域全体のイメージダウンへとつながり、住民の転出や企業の流出につながっていくおそれがある。", "s3": "このような事態を防ぐためにも、特別区は地域の魅力を内外に向けて戦略的に発信するシティプロモーションを推進し、特別区が将来にわたって「住み続けたいまち」「訪れたいまち」であり続けるように取り組んでいかなければならない。", "s4": "以上を踏まえ、特別区が今後どのようにシティプロモーションに取り組むべきか論じていきたい。", "cls": "A", "kind": "kakomon"}, {"year": "2022", "theme": "複雑化・多様化する区民ニーズへの対応について", "short": "複雑化・多様化する区民ニーズ", "s1": "近年、特別区に対する区民ニーズは複雑化・多様化している。その背景には大きく２つの要因が挙げられる。１つ目は、区民の価値観やライフスタイルの多様化である。", "s2": "特別区には全国各地から多くの人口が流入しており、多様な住民によって地域が形成されている。このため、区民一人ひとりの価値観やライフスタイルは多様化が進んでおり、区民ニーズの複雑化・多様化につながっている。２つ目は、高齢化や国際化の進展である。例えば、急速な高齢化に伴い、高齢者からは、介護や医療、就労、貧困など多様な課題への対応が求められている。", "s3": "また、国際化によって外国人住民が増加し、行政への新たなニーズも生まれている。このような背景から、特別区では区民ニーズの複雑化・多様化がますます進行している。", "s4": "以上を踏まえ、特別区が複雑化・多様化する区民ニーズに対しどのように対応していくべきか論じていきたい。", "cls": "C", "kind": "kakomon"}, {"year": "2023", "theme": "これからのイベント実施のあり方について", "short": "これからのイベント実施", "s1": "現在、特別区では、地域でのお祭りや花火大会、文化芸術イベント、講演会、シンポジウム、スポーツ大会など、多種多様なイベントを開催している。このようなイベントは、魅力的な地域づくりを進める上で大きな役割を果たしている。", "s2": "例えば、魅力的なイベントを実施することで多くの人が集い、交流人口の拡大や消費拡大による経済効果を期待できる。また、イベントへの参加を通じて、住民同士の交流の促進、住民の地域への愛着や誇りの醸成、地域文化の振興といった効果も生まれる。", "s3": "このように、イベントには多面的な役割や効果がある。一方で、今後も効果的にイベントを実施していくためには、時代の変化や住民ニーズに合わせて、そのあり方を適切に見直していく必要がある。", "s4": "このことを踏まえ、これからのイベント実施のあり方について、以下に論じていきたい。", "cls": "F", "kind": "kakomon"}, {"year": "2023", "theme": "図書館機能の充実について", "short": "図書館機能の充実", "s1": "図書館は、地域において多様な役割を果たしており、区民の日常生活において大切な拠点となっている。図書館があることで、区民の学習活動や文化活動、調査研究活動が支えられ、日常生活で生じる疑問の解決や知的好奇心の充足が図られている。", "s2": "また、地域の歴史や伝統等に関する資料や情報が収集・保存されることで、地域文化の保存・継承も行われている。さらには、図書館で実施される、子どもへの読み聞かせイベント、高齢者等の生涯学習を支える文化講座等の各種イベントを通じて住民相互の交流が生まれるなど、図書館は地域コミュニティの形成を支える場ともなっている。", "s3": "一方で、区民ニーズの多様化が進む中、今後も区民の豊かな生活を支えていくためには、さらなる利便性の向上など図書館機能の充実を図っていくことが肝要である。", "s4": "以上を踏まえ、図書館機能の充実に向けて必要な取組を論じていきたい。", "cls": "F", "kind": "kakomon"}, {"year": "2024", "theme": "業務におけるタイムパフォーマンス向上について", "short": "業務におけるタイムパフォーマ", "s1": "近年、特別区では、区政運営におけるタイムパフォーマンス（時間対効果）の向上が重要な課題となっている。その理由として、大きく２つの背景が挙げられる。", "s2": "１つ目は、区民ニーズの複雑化・多様化である。区民の価値観やライフスタイルの多様化に伴い、区政に対する区民ニーズは多岐にわたっており、職員は限られた人員と時間で的確に区民ニーズに対応することが求められている。２つ目は、職員の働き方改革の推進である。", "s3": "長時間残業や休日出勤等を抑制し、職員が健康でいきいきと働ける環境を整備していくことは、職員の離職防止や組織力の向上、ひいては安定的な区民サービスの提供につながっていく。これらの背景から、現在の区政運営においては、業務におけるタイムパフォーマンスの向上が重要となっている。", "s4": "以上を踏まえ、業務におけるタイムパフォーマンスの向上策について論じていきたい。", "cls": "E", "kind": "kakomon"}, {"year": "2024", "theme": "特別区の広報におけるＳＮＳの利活用と課題について", "short": "特別区の広報におけるＳＮＳの", "s1": "日々の区政運営において、区民に対する広報活動は極めて重要となっている。的確に広報活動を進めることは、正確な情報により区民生活を支えるだけではなく、区民に開かれた透明性の高い区政運営の実現につながっていく。", "s2": "これまでも特別区では広報紙やホームページなどで活発な広報活動を展開してきたが、情報通信技術が進展する中、区民に迅速かつ確実に情報を伝達するためにも、今後はＳＮＳを活用した広報の重要性がさらに高まっていくだろう。他方、ＳＮＳの利活用に当たっては、克服すべき課題も存在する。", "s3": "このため、特別区の広報活動においては、ＳＮＳの利活用と課題の克服を同時に進めていかなければならない。", "s4": "以上を踏まえ、特別区の広報におけるＳＮＳの利活用のあり方と課題について論じていきたい。", "cls": "F", "kind": "kakomon"}, {"year": "答練2", "theme": "ＡＩ等の先端技術を活用した区政運営について", "short": "ＡＩ等の先端技術を活用した区", "s1": "近年、高齢化の急速な進行や国際化の進展、住民の価値観やライフスタイルの多様化など社会環境は大きく変化しており、特別区が対応すべき地域課題や区民ニーズは多岐にわたっている。", "s2": "一方で、特別区の財政状況は依然として厳しい状況が続いており、限られた人員と予算の中で効率的かつ効果的な区政運営を展開していくことが強く求められている。そのため今後の区政運営においては、従来の手法や手段に縛られず、常に新たな方法によって区政運営を適切に見直していくことが重要となってくる。", "s3": "そして、そのための方法の一つとして、日々進歩するＡＩ等の先端技術の活用が挙げられる。", "s4": "以上を踏まえ、今後の区政運営においてＡＩ等の先端技術をどのように活用していくべきか論じていきたい。", "cls": "C", "kind": "renshu"}, {"year": "答練2", "theme": "効率的で効果的な区政運営について", "short": "効率的で効果的な区政運営", "s1": "近年、少子高齢化対策や公共施設の老朽化対策、大規模自然災害への対応など大きな財政負担を伴う行政課題が山積しており、特別区における財政状況は今後も厳しさを増していくことが想定される。", "s2": "このため特別区においては区政運営の効率化に今後も取り組んでいくことが重要となってくる。一方で、特別区においては、区民からの期待や信頼に応え豊かな区民生活を実現していくためにも、区民サービスの改善や拡充を図るなど、効果的な区政運営を展開していくことも不可欠となっている。", "s3": "このように、これからの区政においては、効率的な運営と同時に効果的な運営も進めていかなければならない。", "s4": "以上を踏まえ、効率的で効果的な区政運営の実現に必要な取組を論じていきたい。", "cls": "Z", "kind": "renshu"}, {"year": "答練4", "theme": "社会環境の変化に即応した区政運営について", "short": "社会環境の変化に即応した区政", "s1": "近年、少子高齢化の進行や国際化の進展、デジタル社会の到来など社会環境は大きく変化しており、地域課題や区民ニーズは複雑化・多様化している。", "s2": "また、昨今では物価高騰などが区民生活に大きな影響を及ぼすなど、常に新たな課題や行政ニーズが生じている現状にある。このような状況において、画一化された手段や従来の方法だけでは区民満足度の高い区政運営を進めていくのは困難である。", "s3": "このため特別区においては、区民一人ひとりが安心や豊かさを感じられる地域を形成していくためにも、社会環境の変化に即応した区政運営を展開していかなければならない。", "s4": "以上を踏まえ、社会環境の変化に即応した区政運営を進めていく上で必要な取組を論じていきたい。", "cls": "C", "kind": "renshu"}, {"year": "答練4", "theme": "環境と共生する持続的な都市づくりについて", "short": "環境と共生する持続的な都市づ", "s1": "現代の大量生産・大量消費・大量廃棄というシステムは、地球環境に大きな負荷を与えている。ごみ問題や大気汚染、水質汚濁といった身近な環境問題のほか、近年では地球温暖化に伴う異常気象の発生、プラスチックごみによる海洋汚染など地球規模での環境問題も深刻化している。", "s2": "このような危機を背景に、国連サミットでは「持続可能な開発目標（SDGｓ）」が採択されるなど、持続可能な社会の実現に向けた動きが世界的にも活発化している。環境問題は、現代を生きる我々だけではなく、将来世代にもつながる課題である。", "s3": "良好な環境を保全し、これを将来に継承していくためにも、特別区は環境と共生する持続的な都市づくりを進めていかなければならない。", "s4": "そのために必要な取組を以下に論じていく。", "cls": "D", "kind": "renshu"}, {"year": "答練6", "theme": "民間活力の活用と自治体職員の役割について", "short": "民間活力の活用と自治体職員の", "s1": "近年、高齢化の急速な進行や国際化の進展、住民の価値観やライフスタイルの多様化など社会環境は大きく変化しており、行政が抱える地域課題や住民ニーズは複雑化・多様化している。", "s2": "一方で、特別区の財政状況は依然として厳しい状況が続いており、限られた人員と予算の中、行政だけで全ての課題に対応することは困難であるだろう。このため、より多くの地域課題の解決を図り、多様な住民ニーズに応えていくためには、民間企業が有する技術や経験、ノウハウ等を効果的に活用していくことが不可欠といえる。", "s3": "しかしながら、民間活力を活用する上では、自治体職員が果たしていかなければならない役割も存在する。", "s4": "以上を踏まえて、民間活力の活用と自治体職員の役割について論じていきたい。", "cls": "C", "kind": "renshu"}, {"year": "答練6", "theme": "地域におけるスポーツの振興について", "short": "地域におけるスポーツの振興", "s1": "スポーツは、年齢・性別・体力・国籍などを問わず誰もが楽しむことができ、体力の向上やストレスの解消、精神的な充足など、人々の心身の健康保持に大きな効果をもたらすものである。", "s2": "また、スポーツを通じて、仲間との交流の促進、青少年の健全育成、地域におけるコミュニティ形成などが図られるなど、スポーツは住民生活において多面的な役割を果たしている。", "s3": "このため特別区においては、地域全体で子どもから高齢者まで誰もが日常生活の中でスポーツに親しめるように取り組んでいくことが重要である。", "s4": "以上を踏まえ、地域におけるスポーツの振興に向けて必要な取組を論じていきたい。", "cls": "F", "kind": "renshu"}, {"year": "答練8", "theme": "行政と住民の合意形成について", "short": "行政と住民の合意形成", "s1": "特別区では、豊かな区民生活の実現に向けて、日々様々な政策の形成やサービスの提供に取り組んでいる。しかし、住民のニーズや価値観は多様化しており、行政の活動に対して一部の住民から大きな反対や反発が生じることもある。", "s2": "例えば、以前にはある区において、区立保育園の民営化に対して、保護者から計画の撤回を求める要望書が提出されることがあった。また、近年では別の区で公立図書館の廃止をめぐり、一部住民からの反発が発生した。このように、日々の行政運営においては、大小を問わず様々な意見対立が生じることがある。", "s3": "一方で、このような多様な声にも丁寧に耳を傾け、双方の合意形成を図りながら魅力的な地域を形成していくことが、地方自治の望ましい姿と言えるだろう。このため、特別区においては、地域住民の多様な要望や意見に十分に配意し、住民との合意に基づき行政運営を進めていくことが肝要となる。", "s4": "以上を踏まえ、行政と住民の合意形成のあり方について論じていきたい。", "cls": "C", "kind": "renshu"}, {"year": "答練8", "theme": "区民との信頼関係の構築について", "short": "区民との信頼関係の構築", "s1": "近年、少子高齢化の進行や地域コミュニティの衰退、公共施設の老朽化など、特別区には多くの課題が山積している。こうしたことから、今後も特別区では、従来の施策に加えて、新たな施策の展開にも積極的に取り組んでいかなければならない。", "s2": "一方で、行政が様々な取組を円滑かつ確実に進めていく上では、区民からの理解や協力が重要となってくる。そして、その理解や協力を得るために不可欠な要素が、区民との信頼関係であると考える。", "s3": "区民からの信頼関係が根底にあることで、区政に対する理解や協力を得られ、行政と区民が一体となった区政運営を進めていくことができるだろう。", "s4": "このことを踏まえ、区民との信頼関係の構築に向けて必要な取組を論じていきたい。", "cls": "Z", "kind": "renshu"}, {"year": "模試", "theme": "地域経済の活性化について", "short": "地域経済の活性化", "s1": "近年、少子高齢化の進行や経済のグローバル化、デジタル技術の進展等により、地域経済を取り巻く環境は大きく変化している。", "s2": "特に、昨今のエネルギー価格の上昇や原材料費の高騰などは、地域経済に対して深刻な打撃を与えており、地域経済の活性化に向けた取組が重要となっている。地域経済の活性化は、雇用機会の確保や消費活動の拡大をもたらし、住民生活の安定や向上にも直結する。", "s3": "活力にあふれた魅力ある地域を形成していくためにも、地域経済の活性化は喫緊の課題である。", "s4": "以上を踏まえ、特別区における地域経済の活性化に向けて必要な取組を論じていきたい。", "cls": "Z", "kind": "renshu"}, {"year": "模試", "theme": "区政運営における透明性の向上と区民参画の推進について", "short": "区政運営における透明性の向上", "s1": "少子高齢化や国際化の進展、住民の価値観やライフスタイルの変化などに伴い、住民ニーズは複雑化・多様化している。行政課題は山積しており、特別区が果たす役割も大きくなっている。", "s2": "一方で、若年層を中心として区民の区政への関心や参画意識の希薄化が課題となっている。また、職員による不祥事も発生しており、区政に対する区民の信頼の確保も強く求められている。", "s3": "このような状況において、区民満足度の高い区政運営を進めていくためには、区民との信頼関係の構築や協働によるまちづくりが大切となってくる。そして、それらを進める上では、区政の透明性向上や区民参画の推進が極めて重要となる。", "s4": "以上を踏まえ、区政運営における透明性の向上と区民参画の推進に向けて、必要な取組をそれぞれ論じていきたい。", "cls": "C", "kind": "renshu"}];
const TEMPLATES = [{"id": "A", "name": "人口減少→財政逼迫 型", "tag": "財政・効率化系テーマに最適", "skeleton": [["①社会背景", "現在、我が国は人口減少社会に突入している。特別区においても将来的に人口が減少に転じることが予測されており、とりわけ生産年齢人口の減少は、区税収入の減少につながっていく。"], ["②課題／緊張", "その一方で、高齢化の進展に伴う福祉ニーズの増大、各種インフラの老朽化対策、大規模自然災害への対応など、特別区における財政状況は今後も厳しさを増していくことが想定される。"], ["③必要性宣言", "このため、特別区においては、〔テーマの核心＝○○の実現〕を進めていかなければならない。"], ["④予告文", "以上を踏まえ、〔テーマ〕に必要な取組を以下に論じていきたい。"]], "swap": "③に入れる「核心」だけ差し替えれば、効率化・経費・財政・シティプロモーション等どのテーマにも転用可。", "members": [{"year": "2007", "theme": "地域の個性を生かした魅力あるまちづくりについて", "short": "地域の個性を生かした魅力ある", "kind": "kakomon"}, {"year": "2013", "theme": "住民サービスとそれに係る経費について", "short": "住民サービスとそれに係る経費", "kind": "kakomon"}, {"year": "2017", "theme": "最小の経費で最大の効果を生む区政運営について", "short": "最小の経費で最大の効果を生む", "kind": "kakomon"}, {"year": "2018", "theme": "行政運営の効率化と信頼性の確保について", "short": "行政運営の効率化と信頼性の確", "kind": "kakomon"}, {"year": "2022", "theme": "シティプロモーションについて", "short": "シティプロモーション", "kind": "kakomon"}], "variant": "変種：答練「効率的で効果的な区政運営」のように、人口減少を①に置かず②の財政負担列挙から入る亜種もある。"}, {"id": "B", "name": "定義スタート 型", "tag": "抽象概念テーマ（○○責任・○○性）に最適", "skeleton": [["①社会背景", "〔テーマ語〕とは、〔一文の定義〕のことである。行政組織には〔テーマ語〕が強く求められている。"], ["②課題／緊張", "では、なぜ〔テーマ語〕が求められるのか。その背景として大きく２点を挙げることができる。１つ目は〔背景1〕、２つ目は〔背景2〕である。"], ["③必要性宣言", "区民からの信頼を醸成していく上でも、〔テーマ語〕の徹底が不可欠である。"], ["④予告文", "以上の背景を踏まえ、〔テーマ〕と、その実現に必要な取組を論じていきたい。"]], "swap": "冒頭の定義文が命。テーマ語を辞書的に一文で定義→背景2点→必要性、の流れは説明責任・倫理・協働・コンプラで共通。", "members": [{"year": "2009", "theme": "行政に問われる説明責任について", "short": "行政に問われる説明責任", "kind": "kakomon"}, {"year": "2010", "theme": "公務員としての倫理について", "short": "公務員としての倫理", "kind": "kakomon"}, {"year": "2011", "theme": "行政と民間の協働について", "short": "行政と民間の協働", "kind": "kakomon"}, {"year": "2015", "theme": "行政におけるコンプライアンスについて", "short": "行政におけるコンプライアンス", "kind": "kakomon"}, {"year": "2017", "theme": "区政運営における区民との協働について", "short": "区政運営における区民との協働", "kind": "kakomon"}], "variant": "変種：「〜とは」で始めず、②で概念を定義する後出し型（答練「信頼関係」など）も同じ骨格として使える。"}, {"id": "C", "name": "多様化→ニーズ 型", "tag": "住民ニーズ・参画・サービス系に最適", "skeleton" /* ---- 構文的な自動穴埋め ----
 * キーワードリストに依存せず、助詞・記号の直前にある「意味の塊（名詞句）」を
 * 候補として切り出す。密度(0〜1)に応じて隠す数を調整する。 */
const DELIM = /(、|。|・|「|」|（|）|は|が|を|に|へ|で|と|も|や|の|から|まで|より|など|という|における|に対して|によって|に伴い|に向けて|として|ため|こと|ながら|つつ)/;
/* 除外語：これだけの塊は隠さない（意味が薄い機能語） */
const SKIP = new Set(['','その','この','あの','また','しかし','一方','近年','現在','例えば','そして','さらに','特に','とりわけ','こうした','このような','これら','それら','我が国','今後','昨今','日々']);

const HIRA=/^[ぁ-ん、。ー]+$/;                 // ひらがなのみ＝機能語/述語の可能性大
const PRED=/(いる|ある|なる|れる|られる|できる|ない|だろう|きた|ている|ていく|ました|である)。?$/; // 述語末尾
function chunkCandidates(text){
  let cands=[];
  const parts=text.split(DELIM);
  let pos=0;
  for(const p of parts){
    if(p===undefined){continue;}
    const start=pos; pos+=p.length;
    if(DELIM.test(p)&&p.length<=6){continue;}
    const s=p.trim();
    if(s.length<2||SKIP.has(s)) continue;
    // 優先度スコア：名詞句らしさ。漢字/カタカナを含むほど高く、ひらがなのみ・述語末は低く。
    let score=p.length;
    if(HIRA.test(s)) score-=6;      // ひらがな塊は下げる
    if(PRED.test(s)) score-=4;      // 述語末は下げる
    if(/[一-龠々ぁ-んー]*[ァ-ヴA-Za-zＡ-Ｚ]/.test(s)) score+=1;
    cands.push([start,start+p.length,score]);
  }
  return cands;
}
/* 予告文の固定型（key強調・かつマスク対象） */
const FORE_LEAD = /(以上を踏まえ、|以上の背景を踏まえ、|このことを踏まえ、|このような状況を踏まえ、|これらのことから、|そのために|そのため今後は|これを実現するため)/;
const FORE_TAIL = /(必要な取組を(以下に)?論じていきたい。|論じていきたい。|論じていく。|述べていきたい。|述べていく。|論じていくこととする。)/;

function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* 答案カードに所属テンプレ型を小さく表示 */
const TNAME={A:'人口減少型',B:'定義型',C:'多様化型',D:'環境型',E:'背景2点型',F:'賞賛型',G:'地域衰退・まちづくり型',Z:'個別型'};
const TCOLOR2={A:'#2b6ca3',B:'#6b4a9c',C:'#b9532e',D:'#4a7c46',E:'#c99a2e',F:'#2f8f83',G:'#a13d5d',Z:'#8a8578'};
function typeBadge(d){

    out+=` <span style="display:inline-block;font-size:10px;font-weight:700;color:#b9532e;background:#f7ece7;border:1px solid #e5c9bd;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;">答練・模試</span>`;
  }

  }

}

/* mode-aware rendering of one step's text */
function renderStep(text, stepN, mode){
  if(!text) return '<span class="empty-note">（この答案は3段構成のため省略）</span>';
  let t = escapeHTML(text);

  if(stepN===4){
    // highlight fixed forecast phrases as key
    t = t.replace(FORE_LEAD, m=>`\u0001${m}\u0002`);   // lead
    t = t.replace(FORE_TAIL, m=>`\u0001${m}\u0002`);   // tail
    if(mode==='read'||mode==='key'){
      return t.replace(/\u0001/g,'<span class="key">').replace(/\u0002/g,'</span>');
    }
    // half/full: mask the key phrases as blanks
    let out='', i=0;
    t=t.replace(/\u0001([^\u0002]*)\u0002/g,(m,inner)=>`<span class="blank step4" data-b="1">${inner}</span>`);
    return t;
  }

  if(mode==='read'||mode==='key') return t; // key mode shows non-forecast steps plain too

  // half & full: 構文チャンクを密度に応じて隠す
  let cands=chunkCandidates(text);
  if(!cands.length) return escapeHTML(text);
  // 名詞句らしさ(score)が高い順に隠す。密度が上がるほど述語やひらがな塊も隠す。
  const scored=cands.map((r,i)=>({i,score:r[2]}));
  scored.sort((a,b)=>b.score-a.score);
  const keep=Math.max(1,Math.round(cands.length*density));
  const chosen=new Set(scored.slice(0,keep).map(x=>x.i));
  let out='',pos=0;
  cands.forEach(([a,b],i)=>{
    out+=escapeHTML(text.slice(pos,a));
    if(chosen.has(i)){
      out+=`<span class="blank step${stepN}" data-b="1">${escapeHTML(text.slice(a,b))}</span>`;
    }else{
      out+=escapeHTML(text.slice(a,b));
    }
    pos=b;
  });
  out+=escapeHTML(text.slice(pos));
  return out;
}

/* ---- SRS (Leitner) ---- */
const SRS_KEY="joron36_srs_v1";
function loadSRS(){try{return JSON.parse(localStorage.getItem(SRS_KEY))||{};}catch(e){return{};}}
function saveSRS(o){try{localStorage.setItem(SRS_KEY,JSON.stringify(o));}catch(e){}}
let srs=loadSRS();
const INTERVALS=[0,1,3,7,16,35];

/* ---- 出典別の学習進捗集計 ---- */
function renderStats(){
  const bar=document.getElementById("statbar");
  const now=Date.now();
  function agg(kind){
    const items=RAW.filter(e=>kind==='all'||e.kind===kind);
    let mastered=0, learning=0, due=0;
    items.forEach(e=>{
      const s=srs[e.year+e.theme];
      if(!s){return;}
      if(s.box>=4) mastered++; else learning++;
      if(s.due<=now) due++;
    });
    return {total:items.length,mastered,learning,due,untouched:items.length-mastered-learning};
  }
  const groups=[
    ['全体','all'],['過去問','kakomon'],['答練・模試','renshu']
  ];
  bar.innerHTML=groups.map(([label,k])=>{
    const a=agg(k);
    const pct=Math.round(a.mastered/a.total*100);
    const dueTxt=a.due>0?`<small>・要復習${a.due}</small>`:'';
    return `<div class="stat">
      <div class="sh">${label}</div>
      <div class="snum">${a.mastered}<small>/${a.total} 習得</small>${dueTxt}</div>
      <div class="sbar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join("");
}

let mode="read", dueOnly=false, filter="", density=0.55, srcFilter="all";
let list=RAW.slice(), idx=0;

const stage=document.getElementById("stage");
const picker=document.getElementById("picker");
const modes=document.getElementById("modes");
const hint=document.getElementById("hint");
const search=document.getElementById("search");
const dueBtn=document.getElementById("dueBtn");
const densityBar=document.getElementById("density");

densityBar.querySelectorAll(".db").forEach(b=>{
  b.onclick=()=>{
    density=parseFloat(b.dataset.d);
    densityBar.querySelectorAll(".db").forEach(x=>x.classList.toggle("on",x===b));
    render();
  };
});

function applyFilter(){
  const now=Date.now();
  list=RAW.filter(e=>{
    if(srcFilter!=="all" && e.kind!==srcFilter) return false;
    if(filter){
      const q=filter.toLowerCase();
      if(!(e.theme.toLowerCase().includes(q)||e.year.includes(q))) return false;
    }
    if(dueOnly){
      const s=srs[e.year+e.theme];
      if(s&&s.due>now) return false; // not due yet
    }
    return true;
  });
  if(idx>=list.length) idx=0;
  document.getElementById("ptot").textContent=list.length;
  buildPicker();
  render();
}

function buildPicker(){
  picker.innerHTML="";
  list.forEach((d,i)=>{
    const c=document.createElement("div");
    const s=srs[d.year+d.theme];
    c.className="chip"+(i===idx?" on":"")+((s&&s.box>=4)?" mastered":"");
    c.innerHTML=`<span class="yb">${d.year}</span>${d.short}`;
    c.onclick=()=>{idx=i;render();};
    picker.appendChild(c);
  });
}

modes.querySelectorAll(".mode").forEach(m=>{m.onclick=()=>{mode=m.dataset.m;render();};});
search.oninput=()=>{filter=search.value.trim();applyFilter();};
dueBtn.onclick=()=>{dueOnly=!dueOnly;dueBtn.classList.toggle("on",dueOnly);applyFilter();};
document.querySelectorAll(".sf").forEach(b=>{
  b.onclick=()=>{
    srcFilter=b.dataset.s;
    document.querySelectorAll(".sf").forEach(x=>x.classList.toggle("on",x===b));
    idx=0; applyFilter();
  };
});

function render(){
  picker.querySelectorAll(".chip").forEach((c,i)=>c.classList.toggle("on",i===idx));
  modes.querySelectorAll(".mode").forEach(m=>m.classList.toggle("on",m.dataset.m===mode));
  document.getElementById("pnum").textContent=list.length?idx+1:0;
  densityBar.style.display=(mode==="half"||mode==="full")?"flex":"none";

  if(!list.length){
    stage.innerHTML=`<div class="card done"><h2>該当なし</h2><p>検索条件を変えるか、復習フィルタを解除してください。</p></div>`;
    hint.textContent=""; return;
  }
  const d=list[idx];

  if(mode==="key"){
    stage.innerHTML=`<div class="card">
      <div class="card-head"><span class="theme-title">${escapeHTML(d.theme)}</span><span class="yr">${d.year}</span></div>
      <div class="step step4">
        <span class="step-label">④ 予告文（最優先の固定型）</span>
        <div class="step-body">${renderStep(d.s4,4,'key')}</div>
      </div></div>`;
    hint.innerHTML="型：<b>以上を踏まえ、〜必要な取組を論じていきたい。</b><br>紫の語句が全答案共通のテンプレート。";
    return;
  }

  const steps=[
    ['①','社会背景',d.s1,1],
    ['②','課題／緊張',d.s2,2],
    ['③','必要性宣言',d.s3,3],
    ['④','予告文',d.s4,4],
  ];
  const stepsHTML=steps.map(([num,lab,txt,n])=>
    `<div class="step step${n}">
      <span class="step-label">${num} ${lab}</span>
      <div class="step-body">${renderStep(txt,n,mode)}</div>
    </div>`).join("");

  let controls="";
  if(mode==="half"){
    controls=`<div class="revealbar"><button class="btn btn-ghost" id="revealBtn">すべて表示</button></div>`;
    hint.textContent="空欄をタップで1つずつ、ボタンで全部表示。";
  }else if(mode==="full"){
    controls=`<div class="revealbar"><button class="btn btn-fill" id="revealBtn">暗唱チェック → 表示</button></div>
      <div class="grade" id="grade">
        <button class="g g-again" onclick="grade('again')">もう一度<small>今日</small></button>
        <button class="g g-hard" onclick="grade('hard')">あいまい<small>翌日</small></button>
        <button class="g g-good" onclick="grade('good')">言えた<small>間隔UP</small></button>
      </div>`;
    hint.textContent="4ステップを頭の中で暗唱→表示→自己採点。";
  }else{
    hint.textContent="色は4つの役割。紫の予告文が全答案共通の型。";
  }

  stage.innerHTML=`<div class="card">
    <div class="card-head"><span class="theme-title">${escapeHTML(d.theme)}</span><span class="yr">${d.year}${typeBadge(d)}</span></div>
    ${stepsHTML}${controls}</div>`;

  stage.querySelectorAll(".blank").forEach(b=>{b.onclick=()=>b.classList.add("show");});
  const rb=document.getElementById("revealBtn");
  if(rb) rb.onclick=()=>{
    stage.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
    const g=document.getElementById("grade"); if(g)g.classList.add("show");
  };
}

function grade(level){
  const d=list[idx], id=d.year+d.theme, now=Date.now();
  let box=(srs[id]&&srs[id].box)||0;
  if(level==="again")box=0; else if(level==="hard")box=Math.max(1,box); else box=Math.min(5,box+1);
  srs[id]={box,due:now+INTERVALS[box]*864e5,last:now};
  saveSRS(srs);
  buildPicker();
  renderStats();
  if(idx<list.length-1){idx++;render();} else finish();
}

function finish(){
  const mastered=Object.values(srs).filter(s=>s.box>=4).length;
  stage.innerHTML=`<div class="card done">
    <h2>1周おつかれさまでした</h2>
    <p>習得（box4以上）：${mastered} / 36 テーマ<br>「言えた」ほど次回間隔が延びます。翌日の再暗唱で定着します。</p>
    <button class="btn btn-fill" style="max-width:220px;margin:0 auto;" onclick="idx=0;mode='full';render();">最初から全隠しで</button>
  </div>`;
  hint.textContent="";
}

document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById("next").onclick=()=>{if(idx<list.length-1){idx++;render();}};

/* ---- タブ切替 ---- */
const TCOLOR={A:'#2b6ca3',B:'#6b4a9c',C:'#b9532e',D:'#4a7c46',E:'#c99a2e',F:'#2f8f83',G:'#a13d5d',Z:'#8a8578'};
const panelE=document.getElementById("panel-essays");
const panelT=document.getElementById("panel-templates");
const navEl=document.getElementById("nav");
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
    const isE=t.dataset.t==="essays";
    panelE.style.display=isE?"block":"none";
    panelT.style.display=isE?"none":"block";
    navEl.style.display=isE?"flex":"none";
  };
});

function escT(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* 〔　〕をプレースホルダ強調に */
function phFmt(s){return escT(s).replace(/〔([^〕]*)〕/g,'<span class="ph">〔$1〕</span>');}

function jumpToEssay(year,theme){
  // 答案タブへ切り替え、該当答案を表示
  document.querySelector('.tab[data-t="essays"]').click();
  filter=""; search.value=""; dueOnly=false; dueBtn.classList.remove("on");
  srcFilter="all"; document.querySelectorAll(".sf").forEach(x=>x.classList.toggle("on",x.dataset.s==="all"));
  applyFilter();
  const i=list.findIndex(e=>e.year===year&&e.theme===theme);
  if(i>=0){idx=i;render();window.scrollTo({top:0,behavior:'smooth'});}
}
window.jumpToEssay=jumpToEssay;

function renderTemplates(){
  const wrap=document.getElementById("tmpl-list");
  wrap.innerHTML=TEMPLATES.map(t=>{
    const col=TCOLOR[t.id]||'#888';
    const skel=t.skeleton.map(([lab,txt])=>
      `<div class="tskel" style="border-left-color:${col}">
        <span class="tslabel" style="color:${col}">${lab}</span>
        <div class="tsbody">${phFmt(txt)}</div>
      </div>`).join("");
    const chips=t.members.map(m=>{
      const isRen=m.kind==='renshu';
      const yb=isRen?`<span class="y" style="color:#b9532e">${m.year}</span>`:`<span class="y">${m.year}</span>`;
      return `<span class="tm-chip" onclick="jumpToEssay('${m.year}','${m.theme.replace(/'/g,"\\'")}')">${yb}${escT(m.short)}</span>`;
    }).join("");
    const skelBlock = t.skeleton.length
      ? skel
      : `<div class="tsbody" style="color:var(--dim);font-style:italic">共通テンプレに乗らない独立型です。個別に読み込んでください。</div>`;
    const swapBlock = t.skeleton.length
      ? `<div class="tswap"><b>転用のコツ：</b>${escT(t.swap)}</div>` : '';
    const varBlock = t.variant
      ? `<div class="tvariant"><b>型の調整：</b>${escT(t.variant)}</div>` : '';
    return `<div class="tcard">
      <div class="tcard-head">
        <span class="tbadge" style="background:${col}">${t.id}</span>
        <span class="tname">${escT(t.name)}</span>
      </div>
      <div class="ttag">${escT(t.tag)}</div>
      ${skelBlock}
      ${swapBlock}
      ${varBlock}
      <div class="tmembers">
        <div class="tm-title">この型の答案（タップで開く）— ${t.members.length}本</div>
        <div class="tm-chips">${chips}</div>
      </div>
    </div>`;
  }).join("");
}

renderTemplates();
renderStats();
applyFilter();
</script>
