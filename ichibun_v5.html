<b>◆ 文末は確度で使い分ける（「だろう」対策）</b>

<li><b>□ 5. だろう</b>：1答案2回まで・段落の最終文に置かない。</li>
</ul>
</div>`;

{round:"第8回", theme:"行政と住民の合意形成について", items:[
 {len:94, type:"③ 手段2つ＋目的", orig:"また、文章だけではなく動画やイラストなどで分かりやすく説明したり、外国人住民向けに多言語表記での説明や情報提供を行うことにより、住民の理解をさらに促進するように努めていかなければならない。",
  fix:"また、文章だけではなく、動画やイラストなどで分かりやすく説明していきたい。外国人住民に向けては、多言語表記での説明や情報提供も必要である。<b>これらにより、</b>住民の理解をさらに促進するよう努めていかなければならない。",
  why:"手段A（動画等）・手段B（多言語）・目的の3情報。「〜たり、〜行うことにより」の連結は主述のねじれの温床。なお原文は「〜たり」が単独使用（本来は「〜たり〜たり」で呼応）の点でも要注意。"}
]},
{round:"第8回", theme:"区民との信頼関係の構築について", items:[
 {len:91, type:"① 中止の「が、」", orig:"現在も各区ではタウンミーティングやモニター制度の実施などにより、区政に対する意見や要望を聴取しているが、区民の中には、広聴への関心が薄い区民や、参加のきっかけがない区民もいるだろう。",
  fix:"現在も各区では、タウンミーティングやモニター制度などにより、区政に対する意見や要望を聴取している。<b>しかし、</b>区民の中には、広聴への関心が薄い人や、参加のきっかけがない人もいるだろう。",
  why:"現状→課題の転換点。ここは逆接の意味を持つため「しかし」で明示的に切ると、本論の「現状→課題→施策」の流れが際立つ。「区民の中には〜区民や〜区民」の同語反復も「人」に置換して解消。"},
 {len:92, type:"③ 利点＋施策＋効果", orig:"さらに、SNSでは双方向のコミュニケーションをとれるという利点を活かし、オンライン上での質問対応や関連情報の提供なども進めていくことで、区民の満足度や信頼度は更に向上していくだろう。",
  fix:"さらに、SNSには双方向のコミュニケーションをとれるという利点がある。この利点を活かし、オンライン上での質問対応や関連情報の提供なども進めていきたい。<b>これにより、</b>区民の満足度や信頼度は更に向上していくだろう。",
  why:"根拠（利点）・施策・効果の三連鎖。3文に分けると各文が短く、主語も明確になる。"}
]},
{round:"04", theme:"区政運営における透明性の向上と区民参画の推進について", items:[
 {len:79, type:"① 中止の「が、」", orig:"現在も、広報紙やホームページ等が活用されているが、より幅広い区民に確実に情報を届けるため、各種SNSやYouTube等の動画媒体も広く活用していきたい。",
  fix:"現在も、広報紙やホームページ等が活用されている。<b>今後は、</b>より幅広い区民に確実に情報を届けるため、各種SNSやYouTube等の動画媒体も広く活用していきたい。",
  why:"現状と施策提案の2情報。逆接でない「が」の典型。「今後は」で時間軸の対比に置き換えると自然。"},
 {len:84, type:"① 譲歩の「が、」", orig:"もちろん、未確定の情報によって区民に混乱を与えないよう配慮は必要であるが、可能な限り政策形成の各段階での情報公開を進めていくことが、区政への信頼向上につながると考える。",
  fix:"もちろん、未確定の情報によって区民に混乱を与えないよう、配慮は必要である。<b>しかし、</b>可能な限り政策形成の各段階で情報公開を進めることが、区政への信頼向上につながると考える。",
  why:"譲歩→主張型。「が」は文法的に正しいが、留意事項パートの主張は独立文にした方が強い。"},
 {len:99, type:"② 根拠＋主張", orig:"加えて、昨今ではZoom等のWeb会議システムにおいて「グループ分け」の機能もあることから、オンライン上で区民によるワークショップを開催することも、区政参画を促す手段として効果的だと考える。",
  fix:"加えて、昨今のZoom等のWeb会議システムには「グループ分け」の機能もある。<b>これを活用すれば、</b>オンライン上で区民によるワークショップを開催でき、区政参画を促す手段として効果的だと考える。",
  why:"「〜あることから」＝根拠の後置連結。根拠を独立文にして「これを活用すれば」で受けると軽くなる。"}
]},
{round:"04", theme:"地域経済の活性化について", items:[
 {len:0, type:"参考", orig:"（このテーマでは分割必須レベルの文は検出されず。75字以上の文5つはいずれも列挙・単一主張で許容範囲）",
  fix:"このテーマの模範答案は一文一義の手本として音読向き。1文平均約50字。",
  why:"比較対象として：分割推奨が多かったのは第2回「効率的で効果的な区政運営」（4文）。序論と本論の効果記述に長文が集中する傾向。"}
]},
{round:"2020-21", theme:"2020年 課題2｜若者の区政参加と地域の活性化について", items:[
 {len:106, type:"② 長い目的節", orig:"地域において高齢化が進む中、地域活動や地域コミュニティの持続化を図り、将来にわたって地域の活力を保持するためには、若者が地域での活動や地域課題の解決に関心に持ち、区政に参加していくことが極めて重要であると考える。",
  fix:"地域において高齢化が進む中、地域活動や地域コミュニティを持続させ、将来にわたって地域の活力を保持していく必要がある。<b>そのためには、</b>若者が地域での活動や地域課題の解決に関心を持ち、区政に参加していくことが極めて重要であると考える。",
  why:"目的節が48字あり、主張に届くまでが長い。目的を独立文にし「そのためには」で受ける。※原文の「関心に持ち」は「関心を持ち」の誤植またはOCR誤読の可能性（未確認）。"}
]},
{round:"2020-21", theme:"2021年 課題1｜インターネットを活用した誰もが利用できる行政手続に向けた取組について", items:[
 {len:90, type:"③ 施策＋狙い", orig:"また、地域の公民館や図書館などに専門スタッフを定期的に配置し、高齢者が気軽にデジタル機器の操作方法や行政手続の方法などついて質問や相談を行えるようにすることも効果的であると考える。",
  fix:"また、地域の公民館や図書館などに、専門スタッフを定期的に配置することも効果的であると考える。<b>これにより、</b>高齢者はデジタル機器の操作方法や行政手続の方法などについて、気軽に質問や相談を行えるようになる。",
  why:"施策と狙い（区民側の変化）を分離。※原文「などついて」は「などについて」の脱字の可能性（未確認）。"}
]},
{round:"2020-21", theme:"2021年 課題2｜持続可能な財政運営と区民サービスについて", items:[
 {len:106, type:"③ 施策＋効果2つ", orig:"例えば、住民からの相談や問合せに対してＡＩチャットボットを活用し対応の自動化を図ることで、住民対応に要する労力や時間、人件費を抑制するとともに、夜間や休日の対応が可能となり、住民サービスの向上も図ることができる。",
  fix:"例えば、住民からの相談や問合せには、ＡＩチャットボットを活用し、対応の自動化を図っていきたい。<b>これにより、</b>住民対応に要する労力や時間、人件費を抑制できる。<b>また、</b>夜間や休日の対応も可能となり、住民サービスの向上も図ることができる。",
  why:"答練第2回のチャットボット文とほぼ同一の三連鎖型。頻出ネタ「先端技術」の効果記述は毎回この型になるため、分割版を定型として持っておくと転用が速い。"}
]},
{round:"2022", theme:"2022年 課題1｜シティプロモーションについて", items:[
 {len:108, type:"③ 施策＋目標", orig:"このような事態を防ぐためにも、特別区は地域の魅力を内外に向けて戦略的に発信するシティプロモーションを推進し、特別区が将来にわたって「住み続けたいまち」「訪れたいまち」であり続けるように取り組んでいかなければならない。",
  fix:"このような事態を防ぐためにも、特別区は、地域の魅力を内外に向けて戦略的に発信するシティプロモーションを推進していかなければならない。<b>これにより、</b>将来にわたって「住み続けたいまち」「訪れたいまち」であり続けることを目指していきたい。",
  why:"施策の宣言と目指す姿は別情報。序論末尾の必要性宣言は1文1メッセージにすると力強い。"},
 {len:108, type:"③ 施策＋効果2つ", orig:"住民たちが自分たちの手で地域の歴史や文化、多様な魅力をガイドブックにまとめ、これを地域全体に配布し共有することで、住民たちが地域の魅力に関する共通認識を持つことができ、地域への愛着や誇りを深めることができると考える。",
  fix:"住民たちが自分たちの手で、地域の歴史や文化、多様な魅力をガイドブックにまとめ、地域全体に配布し共有していく。<b>これにより、</b>住民たちは地域の魅力に関する共通認識を持つことができる。<b>ひいては、</b>地域への愛着や誇りを深めることにもつながると考える。",
  why:"施策・直接効果・波及効果の三連鎖。「ひいては」で波及効果を独立させると、本論6要素の「効果／波及」が採点者に明示できる。"}
]},
{round:"2022", theme:"2022年 課題2｜複雑化・多様化する区民ニーズへの対応について", items:[
 {len:90, type:"② 状況＋主張", orig:"行政に対する期待や要望が多様化する状況において、満足度の高い行政サービスを提供していくためには、住民が有する幅広いニーズを的確に捉え、可能な限り施策に反映していかなければならない。",
  fix:"行政に対する期待や要望は多様化している。<b>このような状況で</b>満足度の高い行政サービスを提供していくためには、住民が有する幅広いニーズを的確に捉え、可能な限り施策に反映していかなければならない。",
  why:"状況説明を短文で切り出すと、後段の主張文が軽くなる。分割は任意レベル（原文でも一義性は保たれている）。"},
 {len:100, type:"② 前提＋主張", orig:"限られた人員や予算の中で複雑化・多様化した区民ニーズに的確に対応していくためには、行政にはない強みを有する地域団体や事業者、ＮＰＯ等の民間団体と連携して課題解決に取り組んでいくことが望ましい。",
  fix:"限られた人員や予算の中で、複雑化・多様化した区民ニーズに的確に対応していくのは容易ではない。<b>このため、</b>行政にはない強みを有する地域団体や事業者、ＮＰＯ等の民間団体と連携して、課題解決に取り組んでいくことが望ましい。",
  why:"柱文としては原文でも成立するが、前提（困難さ）を独立させると連携の必要性が論理的に立つ。"}
]},
{round:"2023", theme:"2023年 課題1｜図書館機能の充実について", items:[
 {len:102, type:"② 事実＋意義", orig:"さらには、図書館で実施される、子どもへの読み聞かせイベント、高齢者等の生涯学習を支える文化講座等の各種イベントを通じて住民相互の交流が生まれるなど、図書館は地域コミュニティの形成を支える場ともなっている。",
  fix:"図書館では、子どもへの読み聞かせイベントや、高齢者等の生涯学習を支える文化講座なども実施されている。<b>こうした催しは</b>住民相互の交流を生み、図書館は地域コミュニティの形成を支える場ともなっている。",
  why:"イベントの列挙・交流の発生・コミュニティ形成の3情報が1文に同居。列挙で1文、意義で1文に。"},
 {len:101, type:"① 中止の「が、」", orig:"また、以前に新型コロナウイルスの感染が拡大した際には各区で密集を防ぐために図書館利用の停止や制限が行われたが、電子書籍を導入することで新たな感染症等の発生時も持続的に区民の読書活動を支えることができる。",
  fix:"また、新型コロナウイルスの感染が拡大した際には、密集を防ぐために各区で図書館利用の停止や制限が行われた。<b>電子書籍を導入すれば、</b>新たな感染症等の発生時にも、区民の読書活動を持続的に支えることができる。",
  why:"過去の事実と施策の効果を「が、」で連結した典型。時制も過去→未来と切り替わるため、切ると読み手の負担が減る。"}
]},
{round:"2023", theme:"2023年 課題2｜これからのイベント実施のあり方について", items:[
 {len:82, type:"① 譲歩の「が、」", orig:"もちろん、イベントの内容によっては効果の測定が困難なものや短期的な評価になじまないものもあるが、可能な限り客観的な指標による検証や評価に努めていくことが大切である。",
  fix:"もちろん、イベントの内容によっては、効果の測定が困難なものや短期的な評価になじまないものもある。<b>しかし、</b>可能な限り客観的な指標による検証や評価に努めていくことが大切である。",
  why:"留意事項パートの譲歩→主張型。答練04の透明性テーマと同型で、「もちろん〜である。しかし〜」を定型化できる。"},
 {len:104, type:"③ 根拠＋施策＋目標", orig:"このように特別区では、区内で様々な機関や団体が活動しているという地域特性を活かし、今後はさらに企業や大学、公的機関など多様な主体との連携を進め、個性的で魅力的なイベントの実施に取り組んでいくことが大切である。",
  fix:"このように特別区には、区内で様々な機関や団体が活動しているという地域特性がある。<b>この強みを活かし、</b>今後はさらに企業や大学、公的機関など多様な主体との連携を進めていきたい。<b>それが、</b>個性的で魅力的なイベントの実施につながっていく。",
  why:"根拠・施策・目標の三連鎖。「地域特性を活かし〜連携を進め〜取り組んでいく」と動詞が3つ連なる文は分割候補。"},
 {len:90, type:"許容（列挙）", orig:"このため特別区では、参加者の満足度が高いイベントや、多くの集客が見込まれるイベントなど、成果の最大化へとつながる魅力的なイベントを企画していくことが重要となってくる。",
  fix:"（分割は必須ではない）主張は「魅力的なイベントを企画すべき」の1つ。例示の列挙で長いだけ。",
  why:"90字だが一文一義は満たしている。例示を削れば60字台に圧縮でき、字数調整の削りしろとして覚えておくと便利。"}
]},
{round:"2024", theme:"2024年 課題1｜特別区の広報におけるＳＮＳの利活用と課題について", items:[
 {len:105, type:"① 中止の「が、」", orig:"これまでも特別区では広報紙やホームページなどで活発な広報活動を展開してきたが、情報通信技術が進展する中、区民に迅速かつ確実に情報を伝達するためにも、今後はＳＮＳを活用した広報の重要性がさらに高まっていくだろう。",
  fix:"これまでも特別区では、広報紙やホームページなどで活発な広報活動を展開してきた。<b>情報通信技術が進展する中、</b>区民に迅速かつ確実に情報を伝達するためにも、今後はＳＮＳを活用した広報の重要性がさらに高まっていくだろう。",
  why:"過去の実績と将来の見通しを「が、」で連結。時間軸（これまで／今後）が変わる箇所は文を切る好機。"},
 {len:109, type:"② 状況＋主張", orig:"高齢者や障害者、外国人住民、子育てをしている区民など、区民の属性が多様化している現状においては、ＳＮＳを活用することで、従来の広報の弱点を補いながら、区民の属性やニーズに沿った情報を効果的に届けていくことが大切である。",
  fix:"高齢者や障害者、外国人住民、子育てをしている区民など、区民の属性は多様化している。<b>このような現状では、</b>ＳＮＳの活用によって従来の広報の弱点を補いながら、区民の属性やニーズに沿った情報を効果的に届けていくことが大切である。",
  why:"「〜現状においては」の前に40字超の状況説明。状況で1文、主張で1文に。"},
 {len:100, type:"③ 施策2つ", orig:"このため、ＳＮＳの活用に当たっては、万全なリスク管理を図る観点からも、ＳＮＳの活用に関する全庁的な方針やルール、留意事項等を定めたガイドラインを策定し、全庁的な共有や理解を図っていくことが大切である。",
  fix:"このため、ＳＮＳの活用に当たっては、万全なリスク管理を図る観点からも、活用方針やルール、留意事項等を定めたガイドラインを策定することが大切である。<b>あわせて、</b>その全庁的な共有や理解も図っていきたい。",
  why:"「策定」と「共有・理解」は別の施策。原文は「ＳＮＳの活用」「全庁的」がそれぞれ2回登場しており、分割で重複語も解消できる。"}
]},
{round:"2024", theme:"2024年 課題2｜業務におけるタイムパフォーマンス向上について", items:[
 {len:109, type:"③ 施策＋効果2つ", orig:"必要に応じて各種事務事業を縮小・廃止し、新たに生み出された時間や財源、マンパワーを優先度や重要度の高い業務に投入していくことは、時間の有効活用や成果の最大化へとつながり、タイムパフォーマンスの向上に大きく貢献していく。",
  fix:"必要に応じて各種事務事業を縮小・廃止し、新たに生み出された時間や財源、マンパワーを優先度や重要度の高い業務に投入していく。<b>これは</b>時間の有効活用や成果の最大化へとつながり、タイムパフォーマンスの向上に大きく貢献していく。",
  why:"主語（〜していくことは）が63字と極端に長い頭でっかち文。施策を言い切ってから「これは」で受けるだけで解消。"},
 {len:147, type:"③ 手順2段階", orig:"具体的には、特別区の各種事務事業について、職員が取り組むべきかどうか、また、職員が取り組んだほうが効率的なのかどうかといった基準によって、従来の事務事業を分類・整理し、外部に委託をしたほうがタイムパフォーマンスの向上につながるものについては、外部委託を進めていくことが重要である。",
  fix:"具体的には、特別区の各種事務事業を、「職員が取り組むべきか」「職員が取り組んだほうが効率的か」といった基準によって分類・整理していく。<b>そのうえで、</b>外部委託のほうがタイムパフォーマンスの向上につながるものについては、外部委託を進めていくことが重要である。",
  why:"全60文中の最長文（147字）。分類・整理→外部委託という2段階の手順は「そのうえで」で切る。基準はカギ括弧で括ると読点が減り視認性も上がる。"},
 {len:93, type:"許容（列挙）", orig:"例えば、ＡＩを活用すれば、会議録の作成、区民からの問合せへの対応、保育園の入選選考、多言語での音声案内など、これまで職員が取り組んできた多様な業務の自動化や省力化を図ることが可能となる。",
  fix:"（分割は必須ではない）主張は「ＡＩで業務の自動化・省力化が可能」の1つ。用途の列挙で長いだけ。",
  why:"※原文の「入選選考」は「入園選考」の誤植またはOCR誤読の可能性（未確認）。本番で書く際は「入園選考」を推奨。"}
]},
{round:"2007-09", theme:"2007年 課題1｜顧客主義に基づく行政サービスについて", items:[
 {len:97, type:"② 定義＋事実", orig:"このような業務の特性から、近年では各自治体においても、住民一人ひとりを「顧客」と捉え、地域住民の視点や立場に立って行政サービスの向上に努めていく「顧客主義」が行政運営の指針として掲げられている。",
  fix:"このような業務の特性から、近年では各自治体においても「顧客主義」が行政運営の指針として掲げられている。<b>顧客主義とは、</b>住民一人ひとりを「顧客」と捉え、地域住民の視点や立場に立って行政サービスの向上に努めていく考え方である。",
  why:"定義（39字）を主語の連体修飾に埋め込んだ型。「〇〇とは〜である」の定義後置型に組み替えると、キーワードが先に立ち採点者が拾いやすい。"},
 {len:98, type:"② 目的＋手段", orig:"特別区にとって「顧客」となる区民に満足度の高い行政サービスを提供していく上では、積極的な広聴活動により区民の意見や要望を十分に把握し、これらを行政サービスに可能な限り反映していくことが大切である。",
  fix:"特別区にとって「顧客」となる区民に、満足度の高い行政サービスを提供していかなければならない。<b>そのためには、</b>積極的な広聴活動により区民の意見や要望を十分に把握し、行政サービスに可能な限り反映していくことが大切である。",
  why:"目的節が38字。目的を独立文にして「そのためには」で受ける定石。頻出ネタ「広聴」の柱文として転用価値が高い。"}
]},
{round:"2007-09", theme:"2008年 課題1｜効率的な行政運営について ※頻出転用文の初出", items:[
 {len:78, type:"② 現状＋見通し", orig:"少子高齢化や大規模災害への対策をはじめ、公共施設の老朽化への対応など、特別区には多くの課題が山積しており、今後も財政需要が増大していくことが見込まれている。",
  fix:"少子高齢化や大規模災害への対策をはじめ、公共施設の老朽化への対応など、特別区には多くの課題が山積している。<b>このため、</b>今後も財政需要が増大していくことが見込まれている。",
  why:"「山積しており、〜見込まれている」の原因＋結果連結。答練第2回の序論と同族。"},
 {len:108, type:"★頻出 三連鎖", orig:"例えば、住民からの相談や問合せに対してＡＩチャットボットを活用し対応の自動化を図ることで、住民対応に要する労力や時間、人件費の抑制を図るとともに、夜間や休日の対応が可能となり、住民サービスの効果を高めることができる。",
  fix:"例えば、住民からの相談や問合せには、ＡＩチャットボットを活用し、対応の自動化を図っていきたい。<b>これにより、</b>住民対応に要する労力や時間、人件費を抑制できる。<b>また、</b>夜間や休日の対応も可能となり、住民サービスの効果を高めることができる。",
  why:"【最重要転用文】この文は2008年・2013年・2017年に一字一句同じ文で登場し、2021年にもほぼ同一の文が出現（計4回）。分割版を暗唱レベルにしておけば、効率化・経費・先端技術系テーマに即転用できる。"},
 {len:89, type:"★頻出 譲歩の「が、」", orig:"もちろん、行政による直営を望む声にも配意することが大切ではあるが、限られた予算と人員の中にあっては、業務の効率化に向けた民間活力の活用方法を継続的に検討していくことが重要である。",
  fix:"もちろん、行政による直営を望む声に配意することも大切である。<b>しかし、</b>限られた予算と人員の中では、業務の効率化に向けた民間活力の活用方法を継続的に検討していくことが重要である。",
  why:"【頻出転用文】2013年（経費の適正化）・2017年（区政運営の合理化）・答練第2回（効率化と効果的なサービス提供）にも、末尾の目的語だけを差し替えた同型文が登場。留意事項パートの定型として「もちろん〜である。しかし〜」で持っておく。"}
]},
{round:"2007-09", theme:"2008年 課題2｜特別区における環境負荷の軽減について", items:[
 {len:0, type:"参考", orig:"（火力発電の93字文と７Rの125字文は、答練第4回「環境と共生する持続的な都市づくり」に同一文が出現。分割例は第4回タブに収録済み）",
  fix:"環境系テーマの説明パートは2008年→答練第4回へそのまま再利用されている。",
  why:"環境ネタの知識文は年をまたいで固定化している好例。分割版も一度作れば使い回せる。"}
]},
{round:"2007-09", theme:"2009年 課題1｜行政に問われる説明責任について", items:[
 {len:86, type:"① 中止の「が、」", orig:"現在においても、広報誌やホームページ、情報公開制度などで適宜情報が提供されているが、今後も可能な限り詳細な情報を積極的に開示し、透明性の高い区政運営に努めていく必要がある。",
  fix:"現在においても、広報誌やホームページ、情報公開制度などで適宜情報が提供されている。<b>今後も、</b>可能な限り詳細な情報を積極的に開示し、透明性の高い区政運営に努めていく必要がある。",
  why:"現状→今後の時間軸転換。逆接でない「が」なので切るのが原則。04の透明性テーマ・2018年にも同族の文がある。"}
]},
{round:"2007-09", theme:"2009年 課題2｜技術の継承について", items:[
 {len:93, type:"③ 手段2つ＋目的", orig:"具体的には、区のWEBサイトや広報誌などでこれらの技術や製品を紹介したり、区のふるさと納税制度の返礼品として伝統工芸品を提供したりすることで、区内外での認知度の向上に努めていきたい。",
  fix:"具体的には、区のWEBサイトや広報誌などでこれらの技術や製品を紹介したり、ふるさと納税の返礼品として伝統工芸品を提供したりしていきたい。<b>これにより、</b>区内外での認知度の向上に努めていく。",
  why:"「〜たり〜たり」の呼応自体は正しい。手段の列挙と目的を切り離すだけで軽くなる。"},
 {len:125, type:"③ 施策2つ＋効果", orig:"そして、ものづくりに関心を持つ若者が実際に職人や技術者と触れ合う機会を設けることや、職人への弟子入りを希望する者への当面の生活費や家賃等を支援する仕組みを構築していくことで、後継者を希望する者と募集する者とのマッチングを促進していくことが重要である。",
  fix:"そして、ものづくりに関心を持つ若者が、実際に職人や技術者と触れ合う機会を設けていきたい。<b>また、</b>職人への弟子入りを希望する者に対し、当面の生活費や家賃等を支援する仕組みも構築していく。<b>これらにより、</b>後継者を希望する者と募集する者とのマッチングを促進していくことが重要である。",
  why:"施策A・施策B・効果の3情報で125字。「〜ことや、〜ことで、」と形式名詞「こと」が連鎖する文は分割候補の目印。"}
]},
{round:"2011-12", theme:"2011年 課題1｜循環型社会の形成に向けて", items:[
 {len:89, type:"① 中止の「が、」", orig:"現在も各区では広報誌等によって啓発活動に取り組んでいるが、ごみの未分別問題や不法投棄問題が発生するなど、環境保全に対する意識が区民の中に十分に浸透しているとは言い難い状況にある。",
  fix:"現在も各区では、広報誌等によって啓発活動に取り組んでいる。<b>しかし、</b>ごみの未分別問題や不法投棄問題が発生するなど、環境保全に対する意識が区民に十分浸透しているとは言い難い。",
  why:"現状→課題の転換点。第8回「区民との信頼関係」の広聴文と同じ「現状肯定→しかし課題」型。本論の現状・課題パートの定型。"},
 {len:96, type:"② 事例＋解説", orig:"例えば、特別区の中でも区民１人当たりのごみ排出量が少ない杉並区では「生ごみギュッとひと絞り」を合言葉として、余分な水分を最後にぎゅっと絞るだけで、生ごみの排出量が軽減されることを周知している。",
  fix:"例えば、区民１人当たりのごみ排出量が少ない杉並区では、「生ごみギュッとひと絞り」を合言葉とした周知を行っている。<b>余分な水分を最後に絞るだけで、</b>生ごみの排出量を軽減できるという取組である。",
  why:"事例名と取組内容の解説を分離。「〜として、〜だけで、〜ことを周知している」と読点間が長い文は、事実→解説の2文構成が読みやすい。"},
 {len:93, type:"許容（条件＋施策）", orig:"例えば、リデュースの推進に当たっては、地域の店舗にマイバッグやタンブラーなどを持参すれば、商店街等で使用できるポイントを付与するなどのインセンティブを与えていく方法がある。",
  fix:"（分割は必須ではない）提示している施策は「インセンティブ付与」の1つ。条件節（〜すれば）で長いだけ。",
  why:"インセンティブ（誘因。行動を促す動機づけ）の説明として条件→帰結は一体で読ませた方が分かりやすい。"}
]},
{round:"2011-12", theme:"2011年 課題2｜行政と民間の協働について ※2017年課題1に同一文あり", items:[
 {len:101, type:"② 二重の目的節", orig:"これまでの行政にはない発想を活用した政策立案を進めていくためにも、また、住民サービスの更なる質の向上を図っていくためにも、多様な強みや専門性を有した民間団体との協働を促進していくことが極めて大切である。",
  fix:"これまでの行政にはない発想を活用した政策立案を進めるためにも、多様な強みや専門性を有した民間団体との協働を促進していくことが極めて大切である。<b>協働は、</b>住民サービスの更なる質の向上にもつながっていく。",
  why:"「〜ためにも、また、〜ためにも」の二重目的節。目的Aで主張を言い切り、目的Bは効果として後置する。2017年課題1にほぼ同一文（民間団体→主体）が再出現。"},
 {len:90, type:"② 否定＋理想像", orig:"行政が民間団体に協働を呼びかけるだけではなく、民間団体から行政にも協働に向けた活発な提案が行われ、双方が一体となって協働のまちづくりを進めていくことを目指していかなければならない。",
  fix:"行政が民間団体に協働を呼びかけるだけでは十分ではない。<b>民間団体から行政にも</b>活発な提案が行われ、双方が一体となって協働のまちづくりを進めていくことを目指さなければならない。",
  why:"「〜だけではなく」の否定部を独立文にすると、後段の理想像が対比で際立つ。"},
 {len:131, type:"③ 例示＋主張の逆順", orig:"また、例えば、地域清掃を行うボランティア団体で人手不足が発生している場合には、ボランティア活動に関心のある高校生や大学生等をマッチングする機会を設けるなど、行政がコーディネーターとして地域で活動する様々な主体を効果的に結びつけていくことも大切な役割となってくる。",
  fix:"また、行政には、コーディネーターとして地域で活動する様々な主体を効果的に結びつけていく役割もある。<b>例えば、</b>地域清掃を行うボランティア団体で人手不足が発生している場合には、活動に関心のある高校生や大学生等をマッチングする機会を設けることなどが考えられる。",
  why:"131字。例示（69字）が主張より先に来るため、文末まで結論が分からない。主張→例示の順に組み替えるのが鉄則。2017年課題1に同一文が再出現。"}
]},
{round:"2011-12", theme:"2012年 課題1｜民間的な発想を生かした行政運営について", items:[
 {len:90, type:"参考（定番序論型）", orig:"近年、高齢化の急速な進行や国際化の進展、住民の価値観やライフスタイルの多様化など社会環境は大きく変化しており、行政が抱える地域課題や住民ニーズは複雑・多様化している。",
  fix:"近年、高齢化の急速な進行や国際化の進展、住民の価値観やライフスタイルの多様化など、社会環境は大きく変化している。<b>これに伴い、</b>行政が抱える地域課題や住民ニーズは複雑化・多様化している。",
  why:"答練第2・4・6回の序論と同一型。2012年時点から使われ続けている最古参の定番文。分割版・連結版の両方を暗唱推奨。"},
 {len:104, type:"許容（列挙）", orig:"例えば、区民が一つの窓口で様々な手続をまとめて行えるワンストップ窓口の整備や、各種申請における提出書類や添付書類の簡素化など、区民の利便性や満足度の向上を起点とした顧客志向の取組を進めていくことが必要である。",
  fix:"（分割は必須ではない）主張は「顧客志向の取組を進める」の1つ。施策例の列挙（44字）で長いだけ。",
  why:"どうしても短くする場合は例を1つに絞る。列挙の長文は減点対象とは考えにくい（採点基準は未確認）。"}
]},
{round:"2011-12", theme:"2012年 課題2｜住民と一体となった活力ある地域づくりについて", items:[
 {len:96, type:"③ 施策＋効果", orig:"例えば、ユニバーサルデザインのまちづくりを検討していく際には、高齢者や障害者、外国人住民などの参画を進めることで、当事者の目線に基づきながら利便性や満足度の高い都市空間を実現することができる。",
  fix:"例えば、ユニバーサルデザインのまちづくりを検討していく際には、高齢者や障害者、外国人住民などの参画を進めていきたい。<b>これにより、</b>当事者の目線に基づいた、利便性や満足度の高い都市空間を実現することができる。",
  why:"「〜ことで、」を「これにより」に置換する基本形。ユニバーサルデザイン×参画の組合せは第4回・2020年にも登場する頻出ネタ。"},
 {len:90, type:"③ 施策2つ", orig:"このため、各区においては、地域活動を体験してみたい住民への積極的な広報や情報提供を進め、新たなメンバーを募集する地域団体とのマッチングを促進していくことが大切である。",
  fix:"このため、各区においては、地域活動を体験してみたい住民に対し、積極的な広報や情報提供を進めていきたい。<b>あわせて、</b>新たなメンバーを募集する地域団体とのマッチングも促進していくことが大切である。",
  why:"広報とマッチングは別施策。「あわせて」で独立させると施策が2つあることが明確になる。マッチング文は2011年協働・2019年コミュニティにも変形出現。"}
]},
{round:"2013-15", theme:"2013年 課題1｜住民サービスとそれに係る経費について", items:[
 {len:0, type:"参考（重複）", orig:"（ＡＩチャットボットの108字文と「直営を望む声」の87字文は、2008年課題1の統合カードを参照。同一／同型文）",
  fix:"このテーマ固有の分割対象は下の1文のみ。",
  why:"経費系テーマは2008年・2017年と施策構成までほぼ共通。1テーマ分の準備で3テーマをカバーできる。"},
 {len:103, type:"③ 施策＋効果", orig:"このため、高いコスト意識や高度な専門性、優れた接遇技術等を有する民間企業等への業務委託や指定管理者制度の導入を進めることで、住民サービスの質の向上を図りながら経費の削減を進めていくことが可能になると考える。",
  fix:"このため、高いコスト意識や高度な専門性、優れた接遇技術等を有する民間企業等への業務委託や、指定管理者制度の導入を進めていきたい。<b>これにより、</b>住民サービスの質の向上を図りながら、経費の削減を進めていくことが可能になると考える。",
  why:"2017年課題2に末尾だけ違う同型文（→経費の抑制と効果の最大化）が出現。指定管理者制度＝公共施設の管理運営を民間事業者等に委ねる制度。"}
]},
{round:"2013-15", theme:"2014年 課題1｜区民から喜ばれる行政サービスの提供について", items:[
 {len:107, type:"② 効果＋対象列挙", orig:"このような取組を徹底的に進めることによって、区役所の開庁時間に来庁できない区民や、区役所から離れた地域に住む区民、障害等により来庁が困難な区民などに喜ばれる利便性の高い行政サービスの提供を実現していくことができる。",
  fix:"このような取組を徹底的に進めることによって、利便性の高い行政サービスの提供を実現していくことができる。<b>開庁時間に来庁できない区民や、</b>区役所から離れた地域に住む区民、障害等により来庁が困難な区民などに、特に喜ばれるだろう。",
  why:"対象の列挙（54字）が「行政サービス」の連体修飾になっており頭でっかち。結論を先に、恩恵を受ける対象を後の文に。"},
 {len:113, type:"① 譲歩の「が、」", orig:"もちろん、行政サービスの民営化には一部の反対意見もあるため慎重な検討が必要であるが、民間企業等が持つ技術や経験、人材、ノウハウを的確に活用していくことで、区民から喜ばれる行政サービスを効果的・効率的に提供していくことができる。",
  fix:"もちろん、行政サービスの民営化には一部の反対意見もあるため、慎重な検討が必要である。<b>しかし、</b>民間企業等が持つ技術や経験、人材、ノウハウを的確に活用すれば、区民から喜ばれる行政サービスを効果的・効率的に提供していくことができる。",
  why:"譲歩→主張型の113字版。主張側も「〜活用していくことで〜できる」を「〜活用すれば〜できる」と条件形にすると更に軽い。"}

const rounds = ["すべて","第2回","第4回","第6回","第8回","04","2007-09","2011-12","2013-15","2016-19","2020-21","2022","2023","2024"];
const tabs = document.getElementById("tabs");
const main = document.getElementById("main");

function render(filter){
  main.innerHTML = GUIDE;
  DATA.filter(g => filter==="すべて" || g.round===filter).forEach(g=>{
    const sec = document.createElement("div");
    sec.innerHTML = `<div class="theme">◆ ${g.round}｜${g.theme}</div>`;
    g.items.forEach(it=>{
      const c = document.createElement("div");
      c.className="card";
      c.innerHTML = `
        <div class="meta">
          ${it.len ? `<span class="chip">${it.len}字</span>`:""}
          <span class="chip ${it.type.startsWith("許容")||it.type.startsWith("参考")?"":"warn"}">${it.type}</span>
        </div>
        <div class="lbl">原文</div>
        <div class="orig">${it.orig}</div>
        <div class="lbl">一文一義に分割</div>
        <div class="fix">${it.fix}</div>
        <div class="why">※ ${it.why}</div>`;
      sec.appendChild(c);
    });
    main.appendChild(sec);
  });
}

rounds.forEach((r,i)=>{
  const b=document.createElement("button");
  b.textContent=r;
  if(i===0)b.classList.add("active");
  b.onclick=()=>{
    tabs.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render(r);
    window.scrollTo({top:0});
  };
  tabs.appendChild(b);
});
render("すべて");
</script>
